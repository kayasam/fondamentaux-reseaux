  <rect x="48" y="107" width="350" height="40" rx="11" fill="#0b5bd3"/><text x="223" y="134" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">1. DU PLUS LOCAL AU PLUS LARGE</text>
