<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".13"/>
    </filter>
    <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/>
    </marker>
    <marker id="purpleArrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1f4d">DEUX FAÇONS DE RÉPARTIR LES RÔLES</text>
  <text x="600" y="80" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">Qui demande la ressource ? Qui la fournit ?</text>

  <g filter="url(#shadow)">
    <rect x="35" y="125" width="550" height="455" rx="17" fill="#fff" stroke="#93c5fd"/>
    <rect x="615" y="125" width="550" height="455" rx="17" fill="#fff" stroke="#c4b5fd"/>
  </g>

  <rect x="55" y="106" width="240" height="40" rx="10" fill="#0755c9"/>
  <text x="175" y="133" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">CLIENT–SERVEUR</text>
  <text x="310" y="174" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Un rôle central fournit le service</text>

  <g text-anchor="middle">
    <rect x="75" y="210" width="155" height="67" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="75" y="304" width="155" height="67" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="75" y="398" width="155" height="67" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="152" y="239" font-size="17" font-weight="800" fill="#1e3a8a">CLIENT A</text>
    <text x="152" y="260" font-size="14" fill="#64748b">demande</text>
    <text x="152" y="333" font-size="17" font-weight="800" fill="#1e3a8a">CLIENT B</text>
    <text x="152" y="354" font-size="14" fill="#64748b">demande</text>
    <text x="152" y="427" font-size="17" font-weight="800" fill="#1e3a8a">CLIENT C</text>
    <text x="152" y="448" font-size="14" fill="#64748b">demande</text>

    <rect x="390" y="244" width="150" height="188" rx="14" fill="#0755c9"/>
    <rect x="418" y="274" width="94" height="84" rx="8" fill="#eff6ff"/>
    <g fill="#60a5fa">
      <circle cx="436" cy="294" r="6"/><rect x="452" y="288" width="42" height="11" rx="5"/>
      <circle cx="436" cy="316" r="6"/><rect x="452" y="310" width="42" height="11" rx="5"/>
      <circle cx="436" cy="338" r="6"/><rect x="452" y="332" width="42" height="11" rx="5"/>
    </g>
    <text x="465" y="387" font-size="19" font-weight="800" fill="#fff">SERVEUR</text>
    <text x="465" y="410" font-size="14" fill="#bfdbfe">fournit et centralise</text>
  </g>

  <path d="M230 243H380" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <path d="M230 337H380" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <path d="M230 431H380" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <path d="M380 258H240" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#purpleArrow)"/>
  <path d="M380 352H240" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#purpleArrow)"/>
  <path d="M380 416H240" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#purpleArrow)"/>

  <rect x="67" y="505" width="486" height="50" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="310" y="527" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Gestion centralisée</text>
  <text x="310" y="547" text-anchor="middle" font-size="14" fill="#64748b">Le serveur doit rester disponible.</text>

  <rect x="635" y="106" width="245" height="40" rx="10" fill="#7c3aed"/>
  <text x="757" y="133" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">PAIR-À-PAIR (P2P)</text>
  <text x="890" y="174" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">Chaque pair peut demander et fournir</text>

  <g text-anchor="middle">
    <rect x="810" y="205" width="160" height="76" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="675" y="376" width="160" height="76" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="945" y="376" width="160" height="76" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="890" y="235" font-size="18" font-weight="800" fill="#5b21b6">PAIR A</text>
    <text x="890" y="258" font-size="13" fill="#64748b">client + serveur</text>
    <text x="755" y="406" font-size="18" font-weight="800" fill="#5b21b6">PAIR B</text>
    <text x="755" y="429" font-size="13" fill="#64748b">client + serveur</text>
    <text x="1025" y="406" font-size="18" font-weight="800" fill="#5b21b6">PAIR C</text>
    <text x="1025" y="429" font-size="13" fill="#64748b">client + serveur</text>
  </g>

  <path d="M837 281L790 366" stroke="#7c3aed" stroke-width="4" marker-start="url(#purpleArrow)" marker-end="url(#purpleArrow)"/>
  <path d="M943 281L990 366" stroke="#7c3aed" stroke-width="4" marker-start="url(#purpleArrow)" marker-end="url(#purpleArrow)"/>
  <path d="M845 414H935" stroke="#7c3aed" stroke-width="4" marker-start="url(#purpleArrow)" marker-end="url(#purpleArrow)"/>
  <text x="890" y="336" text-anchor="middle" font-size="15" font-weight="800" fill="#6d28d9">ÉCHANGES DIRECTS</text>

  <rect x="647" y="505" width="486" height="50" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="890" y="527" text-anchor="middle" font-size="15" font-weight="800" fill="#5b21b6">Pas de rôle central obligatoire</text>
  <text x="890" y="547" text-anchor="middle" font-size="14" fill="#64748b">Contrôle et sauvegarde plus distribués.</text>

  <rect x="35" y="603" width="1130" height="30" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="600" y="624" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Client et serveur sont des rôles : une même machine peut tenir les deux selon l'échange.</text>
</svg>
