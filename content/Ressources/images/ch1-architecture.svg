<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="660" height="290" fill="#F8FAFC" rx="8"/>

  <!-- Title -->
  <text x="330" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#0F172A">Architectures réseau — Client/Serveur vs Pair-à-pair</text>

  <defs>
    <marker id="archArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#3B82F6"/>
    </marker>
  </defs>

  <!-- Divider -->
  <line x1="330" y1="40" x2="330" y2="262" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ====================== -->
  <!-- LEFT — Client/Serveur -->
  <!-- ====================== -->
  <text x="165" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">Client / Serveur</text>
  <text x="165" y="69" text-anchor="middle" font-size="10" fill="#64748B">Un serveur central répond à plusieurs clients</text>

  <!-- Connections (drawn before boxes so arrowheads sit on top) -->
  <line x1="112" y1="93"  x2="213" y2="129" stroke="#3B82F6" stroke-width="2" marker-end="url(#archArrow)"/>
  <line x1="112" y1="155" x2="213" y2="155" stroke="#3B82F6" stroke-width="2" marker-end="url(#archArrow)"/>
  <line x1="112" y1="217" x2="213" y2="181" stroke="#3B82F6" stroke-width="2" marker-end="url(#archArrow)"/>

  <!-- Clients -->
  <rect x="15" y="74"  width="97" height="38" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="63" y="98"  text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A8A">Client 1</text>

  <rect x="15" y="136" width="97" height="38" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="63" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A8A">Client 2</text>

  <rect x="15" y="198" width="97" height="38" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="63" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#1E3A8A">Client 3</text>

  <!-- Server -->
  <rect x="215" y="131" width="100" height="48" rx="8" fill="#1D4ED8"/>
  <text x="265" y="151" text-anchor="middle" font-size="12" font-weight="700" fill="white">Serveur</text>
  <text x="265" y="167" text-anchor="middle" font-size="9" fill="#BFDBFE">fichiers, web, DB…</text>

  <text x="165" y="252" text-anchor="middle" font-size="10" fill="#64748B" font-style="italic">Simple à administrer, mais dépend d'un point central</text>

  <!-- ====================== -->
  <!-- RIGHT — Pair-à-pair -->
  <!-- ====================== -->
  <text x="495" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#1E293B">Pair-à-pair (P2P)</text>
  <text x="495" y="69" text-anchor="middle" font-size="10" fill="#64748B">Chaque appareil est à la fois client et serveur</text>

  <!-- Mesh connections (draw before nodes) -->
  <line x1="430" y1="100" x2="590" y2="100" stroke="#94A3B8" stroke-width="2"/>
  <line x1="590" y1="100" x2="590" y2="210" stroke="#94A3B8" stroke-width="2"/>
  <line x1="590" y1="210" x2="430" y2="210" stroke="#94A3B8" stroke-width="2"/>
  <line x1="430" y1="210" x2="430" y2="100" stroke="#94A3B8" stroke-width="2"/>
  <line x1="430" y1="100" x2="590" y2="210" stroke="#94A3B8" stroke-width="2"/>
  <line x1="590" y1="100" x2="430" y2="210" stroke="#94A3B8" stroke-width="2"/>

  <!-- Nodes -->
  <circle cx="430" cy="100" r="15" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="590" cy="100" r="15" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="590" cy="210" r="15" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="430" cy="210" r="15" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="430" y="105" text-anchor="middle" font-size="13" fill="#3B82F6">▣</text>
  <text x="590" y="105" text-anchor="middle" font-size="13" fill="#3B82F6">▣</text>
  <text x="590" y="215" text-anchor="middle" font-size="13" fill="#3B82F6">▣</text>
  <text x="430" y="215" text-anchor="middle" font-size="13" fill="#3B82F6">▣</text>
  <text x="430" y="130" text-anchor="middle" font-size="10" fill="#334155">PC A</text>
  <text x="590" y="130" text-anchor="middle" font-size="10" fill="#334155">PC B</text>
  <text x="590" y="240" text-anchor="middle" font-size="10" fill="#334155">PC C</text>
  <text x="430" y="240" text-anchor="middle" font-size="10" fill="#334155">PC D</text>

  <text x="495" y="252" text-anchor="middle" font-size="10" fill="#64748B" font-style="italic">Pas de point central, mais plus complexe à sécuriser</text>
</svg>
