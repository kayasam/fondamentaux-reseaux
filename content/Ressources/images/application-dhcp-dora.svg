<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker><marker id="o" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#f59e0b"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#10b981"/></marker></defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">DHCPv4 — OBTENIR UN BAIL AVEC DORA</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Le client commence sans adresse IPv4 utilisable ni connaissance du serveur</text>
  <rect x="30" y="120" width="820" height="490" rx="16" fill="#fff" stroke="#fdba74" filter="url(#s)"/>
  <rect x="48" y="102" width="235" height="40" rx="11" fill="#f59e0b"/><text x="165" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">4 MESSAGES</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="75" y="155" width="180" height="60" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="165" y="181" font-size="18" font-weight="700" fill="#123c8c">CLIENT</text><text x="165" y="203" font-size="13" fill="#526581">UDP/68</text>
    <rect x="625" y="155" width="180" height="60" rx="11" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="715" y="181" font-size="18" font-weight="700" fill="#9a3f00">SERVEUR</text><text x="715" y="203" font-size="13" fill="#526581">UDP/67</text>
  </g>
  <line x1="165" y1="215" x2="165" y2="575" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/><line x1="715" y1="215" x2="715" y2="575" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M175 265H705" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><text x="440" y="251" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#2563eb">1. DHCPDISCOVER</text><text x="440" y="287" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">« Un serveur DHCP est-il disponible ? »</text>
  <path d="M705 350H175" stroke="#f59e0b" stroke-width="3" marker-end="url(#o)"/><text x="440" y="336" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#f59e0b">2. DHCPOFFER</text><text x="440" y="372" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">« Je propose 192.168.10.42/24 »</text>
  <path d="M175 435H705" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><text x="440" y="421" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#2563eb">3. DHCPREQUEST</text><text x="440" y="457" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">« Je demande officiellement cette offre »</text>
  <path d="M705 520H175" stroke="#10b981" stroke-width="3" marker-end="url(#g)"/><text x="440" y="506" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#10b981">4. DHCPACK</text><text x="440" y="542" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">« Bail confirmé avec les options réseau »</text>
  <rect x="260" y="562" width="360" height="32" rx="9" fill="#d1fae5" stroke="#10b981"/><text x="440" y="584" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#06633f">CONFIGURATION UTILISABLE</text>
