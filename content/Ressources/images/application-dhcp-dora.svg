  <rect x="903" y="102" width="205" height="40" rx="11" fill="#7c3aed"/><text x="1005" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">À RETENIR</text>
  <g font-family="Arial" text-anchor="middle">
    <circle cx="1027" cy="195" r="28" fill="#dbeafe" stroke="#2563eb"/><text x="1027" y="203" font-size="21" font-weight="700" fill="#123c8c">D</text><text x="1027" y="242" font-size="15" font-weight="700" fill="#123c8c">DISCOVER</text><text x="1027" y="264" font-size="13" fill="#526581">découvrir</text>
    <circle cx="1027" cy="316" r="28" fill="#fff7ed" stroke="#f59e0b"/><text x="1027" y="324" font-size="21" font-weight="700" fill="#9a3f00">O</text><text x="1027" y="363" font-size="15" font-weight="700" fill="#9a3f00">OFFER</text><text x="1027" y="385" font-size="13" fill="#526581">proposer</text>
    <circle cx="1027" cy="437" r="28" fill="#e0f2fe" stroke="#0284c7"/><text x="1027" y="445" font-size="21" font-weight="700" fill="#075985">R</text><text x="1027" y="484" font-size="15" font-weight="700" fill="#075985">REQUEST</text><text x="1027" y="506" font-size="13" fill="#526581">demander</text>
    <circle cx="1027" cy="558" r="28" fill="#d1fae5" stroke="#10b981"/><text x="1027" y="566" font-size="21" font-weight="700" fill="#06633f">A</text><text x="1027" y="598" font-size="15" font-weight="700" fill="#06633f">ACK</text>
  </g>
  <rect x="210" y="632" width="780" height="36" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="656" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#9a3f00">Les premiers échanges peuvent utiliser le broadcast car le client débute sans configuration</text>
