<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0f8a5f"/></marker>
    <marker id="x" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1f4d">COMMENT LE SWITCH APPREND-IL LES PORTS ?</text>
  <text x="600" y="78" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">Il apprend avec la MAC source, puis décide avec la MAC destination</text>

  <rect x="30" y="115" width="360" height="410" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <rect x="48" y="98" width="210" height="38" rx="10" fill="#0755c9"/><text x="153" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">1. APPRENDRE</text>
  <rect x="62" y="164" width="110" height="52" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="117" y="187" text-anchor="middle" font-size="16" font-weight="800" fill="#1e3a8a">PC A</text><text x="117" y="205" text-anchor="middle" font-size="12" fill="#475569">MAC AA</text>
  <rect x="225" y="270" width="130" height="72" rx="12" fill="#334155"/><text x="290" y="300" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">SWITCH</text><text x="290" y="325" text-anchor="middle" font-size="13" fill="#cbd5e1">entrée port 1</text>
  <path d="M172 190C230 190 210 270 250 278" fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#b)"/>
  <rect x="62" y="375" width="293" height="110" rx="11" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="208" y="402" text-anchor="middle" font-size="17" font-weight="800" fill="#1e3a8a">TABLE MAC</text>
  <text x="92" y="431" font-size="14" font-weight="700" fill="#64748b">ADRESSE</text><text x="282" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">PORT</text>
  <line x1="82" y1="441" x2="335" y2="441" stroke="#bfdbfe"/>
  <text x="92" y="467" font-size="17" font-weight="800" fill="#1d4ed8">AA</text><text x="282" y="467" text-anchor="middle" font-size="17" font-weight="800" fill="#1d4ed8">1</text>
  <text x="208" y="510" text-anchor="middle" font-size="14" fill="#64748b">« MAC source AA vue sur le port 1 »</text>

  <rect x="420" y="115" width="360" height="410" rx="16" fill="#fff" stroke="#fdba74" filter="url(#s)"/>
  <rect x="438" y="98" width="305" height="38" rx="10" fill="#f59e0b"/><text x="590" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">2. DESTINATION INCONNUE</text>
  <rect x="548" y="205" width="105" height="66" rx="11" fill="#334155"/><text x="600" y="244" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">SWITCH</text>
  <rect x="450" y="345" width="86" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="493" y="375" text-anchor="middle" font-weight="700" fill="#334155">PC B</text>
  <rect x="557" y="420" width="86" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="600" y="450" text-anchor="middle" font-weight="700" fill="#334155">PC C</text>
  <rect x="664" y="345" width="86" height="48" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="707" y="375" text-anchor="middle" font-weight="700" fill="#334155">PC D</text>
  <path d="M565 270L510 340M600 271V413M635 270l55 70" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="8 6" marker-end="url(#x)"/>
  <text x="600" y="171" text-anchor="middle" font-size="17" font-weight="800" fill="#92400e">MAC destination DD absente</text>
  <text x="600" y="497" text-anchor="middle" font-size="17" font-weight="800" fill="#c2410c">FLOODING</text>
  <text x="600" y="519" text-anchor="middle" font-size="14" fill="#64748b">Tous les ports du VLAN sauf l'entrée</text>

  <rect x="810" y="115" width="360" height="410" rx="16" fill="#fff" stroke="#86efac" filter="url(#s)"/>
  <rect x="828" y="98" width="285" height="38" rx="10" fill="#0f8a5f"/><text x="970" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">3. DESTINATION CONNUE</text>
  <rect x="938" y="205" width="105" height="66" rx="11" fill="#334155"/><text x="990" y="244" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">SWITCH</text>
  <rect x="840" y="365" width="86" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="883" y="395" text-anchor="middle" font-weight="700" fill="#64748b">PC B</text>
  <rect x="947" y="420" width="86" height="48" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="990" y="450" text-anchor="middle" font-weight="700" fill="#065f46">PC C</text>
  <rect x="1054" y="365" width="86" height="48" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="1097" y="395" text-anchor="middle" font-weight="700" fill="#64748b">PC D</text>
  <path d="M990 271V412" stroke="#0f8a5f" stroke-width="7" marker-end="url(#g)"/>
  <text x="990" y="171" text-anchor="middle" font-size="17" font-weight="800" fill="#166534">MAC destination CC → port 3</text>
  <text x="990" y="497" text-anchor="middle" font-size="17" font-weight="800" fill="#15803d">FORWARDING CIBLÉ</text>
  <text x="990" y="519" text-anchor="middle" font-size="14" fill="#64748b">Une seule copie, vers le bon port</text>

  <rect x="30" y="570" width="1140" height="115" rx="16" fill="#fff" stroke="#c4b5fd"/>
  <rect x="48" y="553" width="245" height="38" rx="10" fill="#7c3aed"/><text x="170" y="579" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">4. VIEILLISSEMENT</text>
  <text x="75" y="623" font-size="17" font-weight="800" fill="#6d28d9">Pourquoi supprimer une entrée ?</text>
  <text x="75" y="651" font-size="16" fill="#475569">Un poste peut changer de port. Une entrée inactive expire afin que le switch puisse réapprendre sa nouvelle position.</text>
  <rect x="895" y="605" width="220" height="48" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1005" y="635" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">MAC + VLAN → PORT</text>
</svg>
