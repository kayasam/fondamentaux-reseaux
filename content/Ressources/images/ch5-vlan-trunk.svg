<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">

<rect width="660" height="300" fill="#F8FAFC" rx="10"/>
<text x="330" y="27" text-anchor="middle" font-size="15" font-weight="600" fill="#1E293B">VLANs et lien trunk 802.1Q</text>

<!-- === Switch A (gauche) === -->
<rect x="155" y="55" width="120" height="185" rx="8" fill="#334155"/>
<text x="215" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="white">Switch A</text>

<!-- Ports Switch A -->
<rect x="145" y="95"  width="18" height="14" rx="3" fill="#10B981"/>
<rect x="145" y="115" width="18" height="14" rx="3" fill="#3B82F6"/>
<rect x="145" y="135" width="18" height="14" rx="3" fill="#F59E0B"/>
<rect x="145" y="155" width="18" height="14" rx="3" fill="#10B981"/>
<rect x="145" y="175" width="18" height="14" rx="3" fill="#3B82F6"/>
<rect x="145" y="195" width="18" height="14" rx="3" fill="#F59E0B"/>

<!-- Port trunk Switch A (droite) -->
<rect x="277" y="130" width="18" height="80" rx="3" fill="#E2E8F0"/>
<text x="286" y="178" text-anchor="middle" font-size="9" fill="#334155" transform="rotate(-90, 286, 178)">TRUNK</text>

<!-- === Switch B (droite) === -->
<rect x="385" y="55" width="120" height="185" rx="8" fill="#334155"/>
<text x="445" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="white">Switch B</text>

<!-- Ports Switch B -->
<rect x="497" y="95"  width="18" height="14" rx="3" fill="#10B981"/>
<rect x="497" y="115" width="18" height="14" rx="3" fill="#3B82F6"/>
<rect x="497" y="135" width="18" height="14" rx="3" fill="#F59E0B"/>
<rect x="497" y="155" width="18" height="14" rx="3" fill="#10B981"/>
<rect x="497" y="175" width="18" height="14" rx="3" fill="#3B82F6"/>
<rect x="497" y="195" width="18" height="14" rx="3" fill="#F59E0B"/>

<!-- Port trunk Switch B (gauche) -->
<rect x="365" y="130" width="18" height="80" rx="3" fill="#E2E8F0"/>

<!-- === Lien trunk === -->
<!-- 3 bandes de couleur pour représenter les 3 VLANs -->
<rect x="295" y="135" width="70" height="20" fill="#10B981" opacity="0.85"/>
<rect x="295" y="157" width="70" height="20" fill="#3B82F6" opacity="0.85"/>
<rect x="295" y="179" width="70" height="20" fill="#F59E0B" opacity="0.85"/>
<text x="330" y="148" text-anchor="middle" font-size="9" font-weight="600" fill="white">VLAN 10</text>
<text x="330" y="170" text-anchor="middle" font-size="9" font-weight="600" fill="white">VLAN 20</text>
<text x="330" y="192" text-anchor="middle" font-size="9" font-weight="600" fill="white">VLAN 30</text>
<rect x="295" y="135" width="70" height="64" fill="none" stroke="#94A3B8" stroke-width="1.5" rx="2"/>
<text x="330" y="218" text-anchor="middle" font-size="10" font-weight="600" fill="#64748B">802.1Q trunk</text>

<!-- === Appareils gauche === -->
<!-- VLAN 10 — Administration -->
<rect x="20" y="90" width="115" height="30" rx="5" fill="#10B981"/>
<text x="77" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="white">Administration</text>
<line x1="135" y1="105" x2="145" y2="102" stroke="#10B981" stroke-width="2"/>

<rect x="20" y="155" width="115" height="30" rx="5" fill="#10B981"/>
<text x="77" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="white">Administration</text>
<line x1="135" y1="170" x2="145" y2="162" stroke="#10B981" stroke-width="2"/>

<!-- VLAN 20 — Comptabilité -->
<rect x="20" y="120" width="115" height="30" rx="5" fill="#3B82F6"/>
<text x="77" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="white">Comptabilité</text>
<line x1="135" y1="135" x2="145" y2="122" stroke="#3B82F6" stroke-width="2"/>

<rect x="20" y="185" width="115" height="30" rx="5" fill="#3B82F6"/>
<text x="77" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="white">Comptabilité</text>
<line x1="135" y1="200" x2="145" y2="182" stroke="#3B82F6" stroke-width="2"/>

<!-- VLAN 30 — Invités -->
<rect x="20" y="220" width="115" height="30" rx="5" fill="#F59E0B"/>
<text x="77" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="white">Invités</text>
<line x1="135" y1="235" x2="145" y2="202" stroke="#F59E0B" stroke-width="2"/>

<!-- === Appareils droite === -->
<rect x="525" y="90"  width="115" height="30" rx="5" fill="#10B981"/>
<text x="582" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="white">Administration</text>
<line x1="515" y1="105" x2="525" y2="102" stroke="#10B981" stroke-width="2"/>

<rect x="525" y="120" width="115" height="30" rx="5" fill="#3B82F6"/>
<text x="582" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="white">Comptabilité</text>
<line x1="515" y1="135" x2="525" y2="122" stroke="#3B82F6" stroke-width="2"/>

<rect x="525" y="155" width="115" height="30" rx="5" fill="#10B981"/>
<text x="582" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="white">Administration</text>
<line x1="515" y1="170" x2="525" y2="162" stroke="#10B981" stroke-width="2"/>

<rect x="525" y="185" width="115" height="30" rx="5" fill="#3B82F6"/>
<text x="582" y="205" text-anchor="middle" font-size="11" font-weight="600" fill="white">Comptabilité</text>
<line x1="515" y1="200" x2="525" y2="182" stroke="#3B82F6" stroke-width="2"/>

<rect x="525" y="220" width="115" height="30" rx="5" fill="#F59E0B"/>
<text x="582" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="white">Invités</text>
<line x1="515" y1="235" x2="525" y2="202" stroke="#F59E0B" stroke-width="2"/>

<!-- Légende -->
<text x="330" y="270" text-anchor="middle" font-size="11" fill="#64748B">Chaque VLAN est un réseau isolé · Les VLANs ne communiquent pas entre eux sans routeur</text>
</svg>
