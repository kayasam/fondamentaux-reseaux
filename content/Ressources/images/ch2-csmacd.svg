<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-grey" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f8a5f"/></marker>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1f4d">CSMA/CD — QUE SE PASSE-T-IL LORS D'UNE COLLISION ?</text>
  <text x="600" y="77" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">Deux machines partagent le même support Ethernet en half-duplex</text>

  <!-- Étape 1 -->
  <rect x="30" y="112" width="350" height="235" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#shadow)"/>
  <rect x="48" y="95" width="225" height="38" rx="10" fill="#0755c9"/>
  <text x="160" y="121" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">1. ÉCOUTER</text>
  <text x="205" y="161" text-anchor="middle" font-size="18" font-weight="800" fill="#1e3a8a">Carrier Sense</text>
  <rect x="65" y="205" width="88" height="48" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="109" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">PC A</text>
  <rect x="257" y="205" width="88" height="48" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="301" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">PC B</text>
  <line x1="153" y1="229" x2="257" y2="229" stroke="#94a3b8" stroke-width="5"/>
  <circle cx="205" cy="229" r="8" fill="#22c55e"/>
  <path d="M94 184q15-15 30 0M286 184q15-15 30 0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="205" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Le support semble libre.</text>
  <text x="205" y="313" text-anchor="middle" font-size="15" fill="#64748b">Les deux machines peuvent émettre.</text>

  <!-- Étape 2 -->
  <rect x="410" y="112" width="350" height="235" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#shadow)"/>
  <rect x="428" y="95" width="250" height="38" rx="10" fill="#2563eb"/>
  <text x="553" y="121" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">2. ÉMETTRE</text>
  <text x="585" y="161" text-anchor="middle" font-size="18" font-weight="800" fill="#1e3a8a">Multiple Access</text>
  <rect x="445" y="205" width="88" height="48" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="489" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">PC A</text>
  <rect x="637" y="205" width="88" height="48" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="681" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">PC B</text>
  <path d="M533 219H575" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <path d="M637 239H595" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <text x="585" y="286" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">A et B démarrent presque ensemble.</text>
  <text x="585" y="313" text-anchor="middle" font-size="15" fill="#64748b">Le même câble est utilisé simultanément.</text>

  <!-- Étape 3 -->
  <rect x="790" y="112" width="380" height="235" rx="16" fill="#fff" stroke="#fca5a5" filter="url(#shadow)"/>
  <rect x="808" y="95" width="285" height="38" rx="10" fill="#dc2626"/>
  <text x="950" y="121" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">3. DÉTECTER</text>
  <text x="980" y="161" text-anchor="middle" font-size="18" font-weight="800" fill="#b91c1c">Collision Detection</text>
  <rect x="825" y="205" width="88" height="48" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="869" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">PC A</text>
  <rect x="1047" y="205" width="88" height="48" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1091" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">PC B</text>
  <path d="M913 229H955M1047 229H1005" stroke="#dc2626" stroke-width="6"/>
  <polygon points="980,190 990,214 1017,207 1002,231 1022,250 994,247 989,274 976,250 951,263 958,237 932,228 957,217 949,192 974,207" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="980" y="238" text-anchor="middle" font-size="20" font-weight="800" fill="#b91c1c">!</text>
  <text x="980" y="289" text-anchor="middle" font-size="17" font-weight="800" fill="#dc2626">Les signaux se mélangent.</text>
  <text x="980" y="315" text-anchor="middle" font-size="15" fill="#64748b">A et B arrêtent immédiatement d'émettre.</text>

  <!-- Flèches de progression -->
  <path d="M380 230H402" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-grey)"/>
  <path d="M760 230H782" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow-grey)"/>

  <!-- Étape 4 -->
  <rect x="30" y="395" width="555" height="235" rx="16" fill="#fff" stroke="#fdba74" filter="url(#shadow)"/>
  <rect x="48" y="378" width="300" height="38" rx="10" fill="#f59e0b"/>
  <text x="198" y="404" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">4. ATTENDRE AU HASARD</text>
  <text x="307" y="444" text-anchor="middle" font-size="18" font-weight="800" fill="#92400e">Backoff aléatoire</text>
  <rect x="82" y="475" width="190" height="105" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="177" y="505" text-anchor="middle" font-size="18" font-weight="800" fill="#1e3a8a">PC A</text>
  <circle cx="140" cy="544" r="23" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <path d="M140 544v-14M140 544l11 7" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <text x="205" y="550" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">attend 2</text>
  <rect x="342" y="475" width="190" height="105" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="437" y="505" text-anchor="middle" font-size="18" font-weight="800" fill="#1e3a8a">PC B</text>
  <circle cx="400" cy="544" r="23" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <path d="M400 544v-14M400 544l-11 8" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <text x="465" y="550" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">attend 5</text>
  <text x="307" y="610" text-anchor="middle" font-size="15" fill="#64748b">Les délais différents évitent une nouvelle collision immédiate.</text>

  <!-- Étape 5 -->
  <rect x="615" y="395" width="555" height="235" rx="16" fill="#fff" stroke="#86efac" filter="url(#shadow)"/>
  <rect x="633" y="378" width="280" height="38" rx="10" fill="#0f8a5f"/>
  <text x="773" y="404" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">5. RÉÉMETTRE</text>
  <text x="892" y="444" text-anchor="middle" font-size="18" font-weight="800" fill="#166534">Nouvelle tentative</text>
  <rect x="660" y="490" width="100" height="52" rx="9" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="710" y="522" text-anchor="middle" font-size="17" font-weight="700" fill="#065f46">PC A</text>
  <rect x="1025" y="490" width="100" height="52" rx="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1075" y="522" text-anchor="middle" font-size="17" font-weight="700" fill="#475569">PC B</text>
  <path d="M760 516H1015" stroke="#0f8a5f" stroke-width="7" marker-end="url(#arrow-green)"/>
  <circle cx="892" cy="516" r="25" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <path d="M880 516l9 9 17-20" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="892" y="574" text-anchor="middle" font-size="17" font-weight="800" fill="#15803d">A transmet avec succès.</text>
  <text x="892" y="605" text-anchor="middle" font-size="15" fill="#64748b">B écoute de nouveau, puis émettra à son tour.</text>

  <!-- Comparaison finale -->
  <rect x="30" y="670" width="555" height="58" rx="13" fill="#fff7ed" stroke="#fdba74"/>
  <text x="307" y="695" text-anchor="middle" font-size="17" font-weight="800" fill="#92400e">HUB + HALF-DUPLEX</text>
  <text x="307" y="716" text-anchor="middle" font-size="15" fill="#7c2d12">CSMA/CD nécessaire • collisions possibles</text>
  <rect x="615" y="670" width="555" height="58" rx="13" fill="#ecfdf5" stroke="#86efac"/>
  <text x="892" y="695" text-anchor="middle" font-size="17" font-weight="800" fill="#166534">SWITCH + FULL-DUPLEX</text>
  <text x="892" y="716" text-anchor="middle" font-size="15" fill="#14532d">CSMA/CD inutile • aucune collision</text>
</svg>
