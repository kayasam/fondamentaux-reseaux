<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="p" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#10b981"/></marker></defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">DNS — PARCOURIR LA HIÉRARCHIE UNE FOIS</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Le résolveur récursif interroge les autorités puis met la réponse en cache</text>
  <rect x="30" y="120" width="840" height="490" rx="16" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/>
  <rect x="48" y="102" width="265" height="40" rx="11" fill="#7c3aed"/><text x="180" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">PREMIÈRE RECHERCHE</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="75" y="260" width="180" height="100" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="165" y="298" font-size="18" font-weight="700" fill="#5620bb">RÉSOLVEUR</text><text x="165" y="326" font-size="14" fill="#526581">cherche la réponse</text>
    <rect x="380" y="155" width="190" height="82" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="475" y="187" font-size="18" font-weight="700" fill="#123c8c">RACINE « . »</text><text x="475" y="214" font-size="14" fill="#526581">indique les serveurs .com</text>
    <rect x="625" y="260" width="190" height="82" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="720" y="292" font-size="18" font-weight="700" fill="#9a3f00">TLD « .com »</text><text x="720" y="319" font-size="14" fill="#526581">indique example.com</text>
    <rect x="380" y="405" width="190" height="100" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="475" y="440" font-size="18" font-weight="700" fill="#06633f">AUTORITAIRE</text><text x="475" y="467" font-size="14" fill="#526581">A = 192.0.2.20</text><text x="475" y="488" font-size="13" fill="#526581">TTL = 3600 s</text>
  </g>
  <path d="M255 280L370 214M570 196L615 268M625 334L570 420M370 455L265 345" stroke="#7c3aed" stroke-width="3" marker-end="url(#p)" fill="none"/>
  <g font-family="Arial" font-size="13" font-weight="700" fill="#7c3aed">
    <text x="280" y="225">1</text><text x="600" y="222">2</text><text x="600" y="397">3</text>
  </g>
  <path d="M370 475L265 360" stroke="#10b981" stroke-width="4" marker-end="url(#g)"/>
  <text x="310" y="440" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#10b981">4. RÉPONSE</text>
  <rect x="190" y="535" width="520" height="45" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="450" y="563" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#06633f">Le serveur autoritaire publie les données officielles de sa zone</text>
  <rect x="910" y="120" width="260" height="490" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <rect x="928" y="102" width="190" height="40" rx="11" fill="#0b5bd3"/><text x="1023" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">CACHE</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="950" y="175" width="180" height="80" rx="11" fill="#dbeafe" stroke="#2563eb"/><text x="1040" y="207" font-size="17" font-weight="700" fill="#123c8c">CLIENT 2</text><text x="1040" y="233" font-size="13" fill="#526581">même question</text>
    <path d="M1040 265V330" stroke="#2563eb" stroke-width="3" marker-end="url(#p)"/>
    <rect x="950" y="340" width="180" height="110" rx="11" fill="#ede9fe" stroke="#7c3aed"/><text x="1040" y="374" font-size="17" font-weight="700" fill="#5620bb">RÉSOLVEUR</text><text x="1040" y="403" font-size="14" fill="#526581">réponse en cache</text><text x="1040" y="428" font-size="13" fill="#526581">TTL restant</text>
    <path d="M1020 460V510" stroke="#10b981" stroke-width="3" marker-end="url(#g)"/>
    <rect x="950" y="520" width="180" height="55" rx="10" fill="#d1fae5" stroke="#10b981"/><text x="1040" y="553" font-size="15" font-weight="700" fill="#06633f">RÉPONSE RAPIDE</text>
  </g>
  <rect x="220" y="630" width="760" height="36" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="654" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#9a3f00">Tant que le TTL reste valide, le cache évite de répéter toute la recherche</text>
</svg>
