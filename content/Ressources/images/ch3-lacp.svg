<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" font-family="Segoe UI,Arial,sans-serif">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="g" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0f8a5f"/></marker></defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1f4d">LACP — PLUSIEURS LIENS, UNE INTERFACE LOGIQUE</text>
  <text x="600" y="80" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">Capacité cumulée pour plusieurs flux et continuité en cas de panne</text>

  <rect x="30" y="115" width="1140" height="300" rx="16" fill="#fff" stroke="#b9d2ff" filter="url(#s)"/>
  <rect x="48" y="98" width="300" height="38" rx="10" fill="#0755c9"/><text x="198" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">1. PORT-CHANNEL LACP</text>
  <rect x="85" y="205" width="190" height="105" rx="14" fill="#334155"/><text x="180" y="247" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">SWITCH A</text><text x="180" y="278" text-anchor="middle" font-size="14" fill="#cbd5e1">interface logique Po1</text>
  <rect x="925" y="205" width="190" height="105" rx="14" fill="#334155"/><text x="1020" y="247" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">SWITCH B</text><text x="1020" y="278" text-anchor="middle" font-size="14" fill="#cbd5e1">interface logique Po1</text>
  <rect x="340" y="155" width="520" height="210" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="600" y="188" text-anchor="middle" font-size="19" font-weight="800" fill="#166534">AGRÉGAT LOGIQUE</text>
  <path d="M275 225H925" stroke="#2563eb" stroke-width="8"/><path d="M275 260H925" stroke="#7c3aed" stroke-width="8"/><path d="M275 295H925" stroke="#0f8a5f" stroke-width="8"/>
  <text x="600" y="220" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">LIEN 1 • 1 Gbit/s</text>
  <text x="600" y="255" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">LIEN 2 • 1 Gbit/s</text>
  <text x="600" y="290" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">LIEN 3 • 1 Gbit/s</text>
  <text x="600" y="340" text-anchor="middle" font-size="17" font-weight="800" fill="#15803d">Capacité totale disponible : 3 Gbit/s</text>
  <text x="600" y="392" text-anchor="middle" font-size="15" fill="#64748b">Les deux équipements voient une seule interface logique.</text>

  <rect x="30" y="465" width="555" height="150" rx="16" fill="#fff" stroke="#fdba74" filter="url(#s)"/>
  <rect x="48" y="448" width="270" height="38" rx="10" fill="#f59e0b"/><text x="183" y="474" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">2. RÉPARTITION</text>
  <g>
    <circle cx="90" cy="525" r="10" fill="#2563eb"/><text x="115" y="531" font-size="16" fill="#475569">Flux A → lien 1</text>
    <circle cx="90" cy="558" r="10" fill="#7c3aed"/><text x="115" y="564" font-size="16" fill="#475569">Flux B → lien 2</text>
    <circle cx="90" cy="591" r="10" fill="#0f8a5f"/><text x="115" y="597" font-size="16" fill="#475569">Flux C → lien 3</text>
  </g>
  <rect x="320" y="515" width="225" height="72" rx="11" fill="#fff7ed" stroke="#fdba74"/><text x="432" y="543" text-anchor="middle" font-size="16" font-weight="800" fill="#92400e">Un flux unique</text><text x="432" y="569" text-anchor="middle" font-size="15" fill="#7c2d12">reste sur un seul lien.</text>

  <rect x="615" y="465" width="555" height="150" rx="16" fill="#fff" stroke="#86efac" filter="url(#s)"/>
  <rect x="633" y="448" width="270" height="38" rx="10" fill="#0f8a5f"/><text x="768" y="474" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">3. REDONDANCE</text>
  <path d="M675 525H1110" stroke="#2563eb" stroke-width="7"/><path d="M675 560H1110" stroke="#dc2626" stroke-width="7" stroke-dasharray="9 7"/><path d="M675 595H1110" stroke="#0f8a5f" stroke-width="7"/>
  <circle cx="892" cy="560" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><path d="M883 551l18 18M901 551l-18 18" stroke="#dc2626" stroke-width="3"/>
  <text x="892" y="510" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Trafic maintenu</text>
  <text x="892" y="610" text-anchor="middle" font-size="15" fill="#64748b">Les liens restants continuent de fonctionner.</text>
</svg>
