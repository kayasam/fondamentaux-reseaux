<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker><marker id="r" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ef4444"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#10b981"/></marker></defs>
  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">TCP — RÉPARER UNE PERTE</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Le réseau peut perdre un paquet ; TCP retransmet les octets manquants</text>
  <rect x="30" y="120" width="1140" height="470" rx="16" fill="#fff" stroke="#fecaca" filter="url(#s)"/>
  <rect x="48" y="102" width="265" height="40" rx="11" fill="#ef4444"/><text x="180" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">PERTE ET REPRISE</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="72" y="155" width="190" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="167" y="191" font-size="18" font-weight="700" fill="#123c8c">ÉMETTEUR</text>
    <rect x="938" y="155" width="190" height="58" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="1033" y="191" font-size="18" font-weight="700" fill="#06633f">RÉCEPTEUR</text>
  </g>
  <line x1="167" y1="213" x2="167" y2="555" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="1033" y1="213" x2="1033" y2="555" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M177 250H1023" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <text x="600" y="239" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#2563eb">Seq = 1000 • 500 octets — reçu</text>
  <path d="M177 315L555 315" stroke="#ef4444" stroke-width="3"/>
  <path d="M645 315H1023" stroke="#ef4444" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#r)" opacity=".35"/>
  <circle cx="600" cy="315" r="24" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><path d="M588 303L612 327M612 303L588 327" stroke="#ef4444" stroke-width="4"/>
  <text x="600" y="288" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#ef4444">Seq = 1500 • PERDU</text>
  <path d="M177 380H1023" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <text x="600" y="369" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#2563eb">Seq = 2000 • reçu hors ordre</text>
  <path d="M1023 435H177" stroke="#f59e0b" stroke-width="3" marker-end="url(#r)"/>
  <text x="600" y="424" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#f59e0b">ACK = 1500 — « j'attends toujours 1500 »</text>
  <path d="M177 500H1023" stroke="#10b981" stroke-width="4" marker-end="url(#g)"/>
  <text x="600" y="489" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#10b981">RETRANSMISSION — Seq = 1500</text>
  <path d="M1023 550H177" stroke="#10b981" stroke-width="3" marker-end="url(#g)"/>
  <text x="600" y="539" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#10b981">ACK = 2500 — flux continu rétabli</text>
  <rect x="235" y="608" width="730" height="38" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="600" y="633" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#06633f">La perte est masquée à l'application si TCP parvient à récupérer les données</text>
