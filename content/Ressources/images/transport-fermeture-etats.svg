<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker><marker id="o" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#f59e0b"/></marker></defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">TCP — FERMER LES DEUX SENS</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Chaque extrémité termine séparément son émission</text>
  <rect x="30" y="120" width="730" height="490" rx="16" fill="#fff" stroke="#fdba74" filter="url(#s)"/>
  <rect x="48" y="102" width="245" height="40" rx="11" fill="#f59e0b"/><text x="170" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">FERMETURE NORMALE</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="70" y="155" width="150" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="145" y="190" font-size="17" font-weight="700" fill="#123c8c">CLIENT</text>
    <rect x="570" y="155" width="150" height="56" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="645" y="190" font-size="17" font-weight="700" fill="#5620bb">SERVEUR</text>
  </g>
  <line x1="145" y1="211" x2="145" y2="580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="645" y1="211" x2="645" y2="580" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M155 260H635" stroke="#f59e0b" stroke-width="3" marker-end="url(#o)"/><text x="395" y="248" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#f59e0b">1. FIN — « j'ai fini d'envoyer »</text>
  <path d="M635 335H155" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><text x="395" y="323" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#2563eb">2. ACK — « fermeture reçue »</text>
  <path d="M635 410H155" stroke="#f59e0b" stroke-width="3" marker-end="url(#o)"/><text x="395" y="398" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#f59e0b">3. FIN — « moi aussi, j'ai fini »</text>
  <path d="M155 485H635" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><text x="395" y="473" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#2563eb">4. ACK — « fermeture reçue »</text>
  <rect x="235" y="525" width="320" height="50" rx="10" fill="#fff7ed" stroke="#f59e0b"/><text x="395" y="556" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#9a3f00">CLIENT : TIME_WAIT temporaire</text>
  <rect x="800" y="120" width="370" height="490" rx="16" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/>
  <rect x="818" y="102" width="220" height="40" rx="11" fill="#7c3aed"/><text x="928" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">ÉTATS À LIRE</text>
  <g font-family="Arial">
    <rect x="840" y="165" width="290" height="55" rx="10" fill="#ecfdf5" stroke="#10b981"/><text x="865" y="198" font-size="16" font-weight="700" fill="#06633f">LISTEN</text><text x="985" y="198" font-size="14" fill="#526581">attend</text>
    <rect x="840" y="235" width="290" height="55" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="865" y="268" font-size="16" font-weight="700" fill="#123c8c">SYN_SENT</text><text x="1000" y="268" font-size="14" fill="#526581">connexion demandée</text>
    <rect x="840" y="305" width="290" height="55" rx="10" fill="#d1fae5" stroke="#10b981"/><text x="865" y="338" font-size="16" font-weight="700" fill="#06633f">ESTABLISHED</text><text x="1038" y="338" font-size="14" fill="#526581">active</text>
    <rect x="840" y="375" width="290" height="55" rx="10" fill="#fff7ed" stroke="#f59e0b"/><text x="865" y="408" font-size="16" font-weight="700" fill="#9a3f00">FIN_WAIT</text><text x="1006" y="408" font-size="14" fill="#526581">fermeture active</text>
    <rect x="840" y="445" width="290" height="55" rx="10" fill="#fee2e2" stroke="#ef4444"/><text x="865" y="478" font-size="16" font-weight="700" fill="#991b1b">CLOSE_WAIT</text><text x="1018" y="478" font-size="14" fill="#526581">application locale</text>
    <rect x="840" y="515" width="290" height="55" rx="10" fill="#f5f3ff" stroke="#7c3aed"/><text x="865" y="548" font-size="16" font-weight="700" fill="#5620bb">TIME_WAIT</text><text x="1008" y="548" font-size="14" fill="#526581">mémoire temporaire</text>
  </g>
  <rect x="235" y="630" width="730" height="36" rx="10" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="600" y="654" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#075985">TIME_WAIT permet notamment de retransmettre le dernier ACK et d'écarter d'anciens segments</text>
</svg>
