<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="Segoe UI,Arial,sans-serif">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="r" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#dc2626"/></marker></defs>
  <rect width="1200" height="690" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1f4d">STP — CONSERVER LA REDONDANCE SANS CRÉER DE BOUCLE</text>
  <text x="600" y="80" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">La boucle physique reste câblée, mais un chemin est bloqué logiquement</text>

  <rect x="30" y="115" width="555" height="420" rx="16" fill="#fff" stroke="#fca5a5" filter="url(#s)"/>
  <rect x="48" y="98" width="285" height="38" rx="10" fill="#dc2626"/><text x="190" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">1. SANS STP : LA BOUCLE</text>
  <g>
    <rect x="225" y="175" width="160" height="65" rx="11" fill="#334155"/><text x="305" y="214" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">SWITCH A</text>
    <rect x="88" y="386" width="160" height="65" rx="11" fill="#334155"/><text x="168" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">SWITCH B</text>
    <rect x="362" y="386" width="160" height="65" rx="11" fill="#334155"/><text x="442" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">SWITCH C</text>
    <path d="M265 240L197 382M345 240l68 142M248 418H358" fill="none" stroke="#dc2626" stroke-width="7"/>
    <path d="M235 278L202 347M390 278l32 69M282 418h52" stroke="#dc2626" stroke-width="5" marker-end="url(#r)"/>
  </g>
  <polygon points="305,280 315,305 342,298 327,322 347,341 319,337 314,365 300,341 275,354 283,328 257,319 282,308 274,283 299,298" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="305" y="329" text-anchor="middle" font-size="19" font-weight="800" fill="#b91c1c">!</text>
  <text x="305" y="484" text-anchor="middle" font-size="17" font-weight="800" fill="#dc2626">TEMPÊTE DE BROADCAST</text>
  <text x="305" y="510" text-anchor="middle" font-size="15" fill="#64748b">La trame tourne et se multiplie sans fin.</text>

  <rect x="615" y="115" width="555" height="420" rx="16" fill="#fff" stroke="#86efac" filter="url(#s)"/>
  <rect x="633" y="98" width="315" height="38" rx="10" fill="#0f8a5f"/><text x="790" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">2. AVEC STP : UN ARBRE</text>
  <rect x="805" y="165" width="160" height="74" rx="11" fill="#d1fae5" stroke="#10b981" stroke-width="3"/><text x="885" y="195" text-anchor="middle" font-size="18" font-weight="800" fill="#065f46">SWITCH A</text><text x="885" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">ROOT BRIDGE</text>
  <rect x="668" y="386" width="160" height="65" rx="11" fill="#334155"/><text x="748" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">SWITCH B</text>
  <rect x="942" y="386" width="160" height="65" rx="11" fill="#334155"/><text x="1022" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">SWITCH C</text>
  <path d="M845 239L777 382M925 239l68 142" fill="none" stroke="#0f8a5f" stroke-width="7"/>
  <path d="M828 418H942" fill="none" stroke="#94a3b8" stroke-width="7" stroke-dasharray="10 8"/>
  <circle cx="885" cy="418" r="23" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><path d="M873 406l24 24M897 406l-24 24" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <text x="885" y="482" text-anchor="middle" font-size="17" font-weight="800" fill="#15803d">Deux liens actifs, un lien bloqué</text>
  <text x="885" y="508" text-anchor="middle" font-size="15" fill="#64748b">Il n'existe plus qu'un seul chemin logique.</text>

  <rect x="30" y="580" width="1140" height="77" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="48" y="563" width="260" height="38" rx="10" fill="#0755c9"/><text x="178" y="589" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">3. EN CAS DE PANNE</text>
  <text x="75" y="628" font-size="17" fill="#334155">Si un lien actif tombe, STP recalcule l'arbre et peut ouvrir le lien de secours.</text>
  <text x="835" y="628" font-size="17" font-weight="800" fill="#1d4ed8">RSTP : convergence plus rapide</text>
</svg>
