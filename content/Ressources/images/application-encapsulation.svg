  <rect x="210" y="625" width="780" height="36" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="600" y="649" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#06633f">À la réception, chaque couche retire son en-tête dans l'ordre inverse</text>
