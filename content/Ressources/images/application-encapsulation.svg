<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">ENCAPSULATION — DE HTTP AU SIGNAL</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Chaque couche ajoute les informations nécessaires à son propre rôle</text>
  <rect x="30" y="120" width="1140" height="480" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <rect x="48" y="102" width="245" height="40" rx="11" fill="#0b5bd3"/><text x="170" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">À L'ÉMISSION</text>
  <g font-family="Arial">
    <rect x="75" y="165" width="210" height="65" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="180" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#5620bb">APPLICATION</text><text x="180" y="215" text-anchor="middle" font-size="13" fill="#526581">requête HTTP</text>
    <path d="M295 198H365" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
    <rect x="385" y="155" width="740" height="85" rx="11" fill="#f5f3ff" stroke="#c4b5fd"/><rect x="385" y="155" width="105" height="85" rx="11" fill="#7c3aed"/><text x="437" y="204" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">HTTP</text><text x="805" y="193" text-anchor="middle" font-size="17" font-weight="700" fill="#5620bb">GET /reseaux/index.html</text><text x="805" y="216" text-anchor="middle" font-size="13" fill="#526581">message applicatif</text>
    <rect x="75" y="270" width="210" height="65" rx="11" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="180" y="297" text-anchor="middle" font-size="17" font-weight="700" fill="#075985">PROTECTION</text><text x="180" y="320" text-anchor="middle" font-size="13" fill="#526581">TLS</text>
    <path d="M295 303H365" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
    <rect x="385" y="260" width="740" height="85" rx="11" fill="#e0f2fe" stroke="#0284c7"/><rect x="385" y="260" width="105" height="85" rx="11" fill="#0284c7"/><text x="437" y="309" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">TLS</text><text x="805" y="298" text-anchor="middle" font-size="17" font-weight="700" fill="#075985">DONNÉES HTTP PROTÉGÉES</text><text x="805" y="321" text-anchor="middle" font-size="13" fill="#526581">enregistrements TLS</text>
    <rect x="75" y="375" width="210" height="65" rx="11" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="180" y="402" text-anchor="middle" font-size="17" font-weight="700" fill="#06633f">TRANSPORT</text><text x="180" y="425" text-anchor="middle" font-size="13" fill="#526581">TCP</text>
    <path d="M295 408H365" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
    <rect x="385" y="365" width="740" height="85" rx="11" fill="#ecfdf5" stroke="#10b981"/><rect x="385" y="365" width="105" height="85" rx="11" fill="#10b981"/><text x="437" y="414" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">TCP</text><text x="805" y="403" text-anchor="middle" font-size="17" font-weight="700" fill="#06633f">PORTS + SÉQUENCES + DONNÉES TLS</text><text x="805" y="426" text-anchor="middle" font-size="13" fill="#526581">segment TCP</text>
    <rect x="75" y="480" width="210" height="65" rx="11" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="180" y="507" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f00">RÉSEAU + LIAISON</text><text x="180" y="530" text-anchor="middle" font-size="13" fill="#526581">IP puis Ethernet/Wi-Fi</text>
    <path d="M295 513H365" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
    <rect x="385" y="470" width="740" height="85" rx="11" fill="#fff7ed" stroke="#f59e0b"/><rect x="385" y="470" width="85" height="85" rx="11" fill="#f59e0b"/><text x="427" y="519" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">MAC</text><rect x="470" y="470" width="85" height="85" fill="#fb923c"/><text x="512" y="519" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">IP</text><text x="840" y="508" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3f00">SEGMENT TCP + DONNÉES</text><text x="840" y="531" text-anchor="middle" font-size="13" fill="#526581">trame transmise sous forme de signal</text>
