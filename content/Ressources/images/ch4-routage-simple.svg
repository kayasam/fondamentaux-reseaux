<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#f8fafc"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Routage simple entre deux réseaux</text>

  <rect x="50" y="100" rx="18" ry="18" width="280" height="180" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="85" y="140" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">LAN 1</text>
  <text x="85" y="178" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1e3a8a">192.168.1.0/24</text>
  <rect x="85" y="205" rx="10" ry="10" width="110" height="42" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="103" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a">PC</text>
  <text x="95" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">192.168.1.42</text>

  <rect x="390" y="140" rx="18" ry="18" width="180" height="110" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
  <text x="445" y="185" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#7c2d12">Routeur</text>
  <text x="480" y="214" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#7c2d12">Passerelle</text>

  <rect x="630" y="100" rx="18" ry="18" width="280" height="180" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="665" y="140" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#166534">LAN 2</text>
  <text x="665" y="178" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#166534">10.0.0.0/24</text>
  <rect x="760" y="205" rx="10" ry="10" width="110" height="42" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="785" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0f172a">Srv</text>
  <text x="744" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">10.0.0.20</text>

  <line x1="195" y1="226" x2="390" y2="195" stroke="#2563eb" stroke-width="4"/>
  <polygon points="390,195 376,188 378,202" fill="#2563eb"/>
  <line x1="570" y1="195" x2="760" y2="226" stroke="#16a34a" stroke-width="4"/>
  <polygon points="760,226 748,216 746,230" fill="#16a34a"/>

  <text x="265" y="168" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Même réseau : direct</text>
  <text x="350" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155">Vers un autre réseau : le PC envoie</text>
  <text x="350" y="340" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#334155">le paquet à sa passerelle par défaut</text>
</svg>
