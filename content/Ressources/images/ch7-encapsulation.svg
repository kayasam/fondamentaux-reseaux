<svg viewBox="0 0 660 290" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">

<rect width="660" height="290" fill="#F8FAFC" rx="10"/>
<text x="330" y="27" text-anchor="middle" font-size="15" font-weight="600" fill="#1E293B">Encapsulation — chaque couche enveloppe la suivante</text>

<!-- Vertical separator -->
<line x1="88" y1="40" x2="88" y2="258" stroke="#E2E8F0" stroke-width="1.5"/>

<!-- === L7 Application === -->
<text x="83" y="73" text-anchor="end" font-size="11" font-weight="600" fill="#6366F1">L7</text>
<text x="83" y="86" text-anchor="end" font-size="10" fill="#6366F1">Application</text>
<rect x="95" y="52" width="555" height="42" rx="4" fill="#6366F1"/>
<text x="372" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="white">Données HTTP</text>

<!-- === L4 Transport === -->
<text x="83" y="123" text-anchor="end" font-size="11" font-weight="600" fill="#EF4444">L4</text>
<text x="83" y="136" text-anchor="end" font-size="10" fill="#EF4444">Transport</text>
<rect x="95"  y="104" width="78" height="42" rx="4" fill="#EF4444"/>
<text x="134" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="white">En-tête TCP</text>
<rect x="175" y="104" width="475" height="42" rx="4" fill="#6366F1"/>
<text x="412" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="white">Données HTTP</text>

<!-- === L3 Réseau === -->
<text x="83" y="173" text-anchor="end" font-size="11" font-weight="600" fill="#F59E0B">L3</text>
<text x="83" y="186" text-anchor="end" font-size="10" fill="#F59E0B">Réseau</text>
<rect x="95"  y="156" width="58" height="42" rx="4" fill="#F59E0B"/>
<text x="124" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="white">En-tête IP</text>
<rect x="155" y="156" width="78" height="42" rx="4" fill="#EF4444"/>
<text x="194" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="white">TCP</text>
<rect x="235" y="156" width="415" height="42" rx="4" fill="#6366F1"/>
<text x="442" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="white">Données HTTP</text>

<!-- === L2 Liaison === -->
<text x="83" y="223" text-anchor="end" font-size="11" font-weight="600" fill="#10B981">L2</text>
<text x="83" y="236" text-anchor="end" font-size="10" fill="#10B981">Liaison</text>
<rect x="95"  y="208" width="62" height="42" rx="4" fill="#10B981"/>
<text x="126" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="white">ETH</text>
<rect x="159" y="208" width="58" height="42" rx="4" fill="#F59E0B"/>
<text x="188" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="white">IP</text>
<rect x="219" y="208" width="78" height="42" rx="4" fill="#EF4444"/>
<text x="258" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="white">TCP</text>
<rect x="299" y="208" width="298" height="42" rx="4" fill="#6366F1"/>
<text x="448" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="white">Données HTTP</text>
<rect x="599" y="208" width="51" height="42" rx="4" fill="#64748B"/>
<text x="624" y="234" text-anchor="middle" font-size="11" font-weight="600" fill="white">FCS</text>

<!-- Note -->
<text x="330" y="275" text-anchor="middle" font-size="11" fill="#94A3B8">À la réception, chaque couche retire son en-tête et passe les données à la couche supérieure</text>
</svg>
