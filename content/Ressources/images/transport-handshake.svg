<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
    <marker id="o" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#f59e0b"/></marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#10b981"/></marker>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">TCP — ÉTABLIR LA CONNEXION</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Le handshake synchronise les deux extrémités avant les données applicatives</text>
  <rect x="30" y="120" width="820" height="455" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <rect x="50" y="102" width="260" height="40" rx="11" fill="#0b5bd3"/><text x="180" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">3-WAY HANDSHAKE</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="75" y="158" width="180" height="60" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="165" y="184" font-size="18" font-weight="700" fill="#123c8c">CLIENT</text><text x="165" y="205" font-size="13" fill="#526581">53142</text>
    <rect x="625" y="158" width="180" height="60" rx="11" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="715" y="184" font-size="18" font-weight="700" fill="#5620bb">SERVEUR</text><text x="715" y="205" font-size="13" fill="#526581">443 en LISTEN</text>
  </g>
  <line x1="165" y1="218" x2="165" y2="540" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="715" y1="218" x2="715" y2="540" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
  <path d="M175 270H705" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <text x="440" y="258" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#2563eb">1. SYN — Seq = 1000</text>
  <text x="440" y="292" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">« Je souhaite ouvrir une connexion »</text>
  <path d="M705 365H175" stroke="#f59e0b" stroke-width="3" marker-end="url(#o)"/>
  <text x="440" y="353" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#f59e0b">2. SYN-ACK — Seq = 7000, Ack = 1001</text>
  <text x="440" y="387" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">« Je suis prêt et j'attends ton octet 1001 »</text>
  <path d="M175 460H705" stroke="#10b981" stroke-width="3" marker-end="url(#g)"/>
  <text x="440" y="448" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#10b981">3. ACK — Ack = 7001</text>
  <text x="440" y="482" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">« J'ai reçu ta réponse ; la connexion est établie »</text>
  <rect x="250" y="515" width="380" height="42" rx="10" fill="#d1fae5" stroke="#10b981"/>
  <text x="440" y="542" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#06633f">ESTABLISHED — les données peuvent circuler</text>
  <rect x="885" y="120" width="285" height="455" rx="16" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/>
  <rect x="903" y="102" width="205" height="40" rx="11" fill="#7c3aed"/><text x="1005" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">À QUOI SERT-IL ?</text>
  <g font-family="Arial" text-anchor="middle">
    <circle cx="1027" cy="195" r="27" fill="#dbeafe" stroke="#2563eb"/><text x="1027" y="202" font-size="21" font-weight="700" fill="#123c8c">1</text><text x="1027" y="244" font-size="16" font-weight="700" fill="#123c8c">Vérifier les deux sens</text><text x="1027" y="266" font-size="13" fill="#526581">client ↔ serveur</text>
    <circle cx="1027" cy="318" r="27" fill="#fff7ed" stroke="#f59e0b"/><text x="1027" y="325" font-size="21" font-weight="700" fill="#9a3f00">2</text><text x="1027" y="367" font-size="16" font-weight="700" fill="#9a3f00">Synchroniser</text><text x="1027" y="389" font-size="13" fill="#526581">les séquences initiales</text>
    <circle cx="1027" cy="441" r="27" fill="#d1fae5" stroke="#10b981"/><text x="1027" y="448" font-size="21" font-weight="700" fill="#06633f">3</text><text x="1027" y="490" font-size="16" font-weight="700" fill="#06633f">Créer l'état</text><text x="1027" y="512" font-size="13" fill="#526581">et négocier les options</text>
  </g>
</svg>
