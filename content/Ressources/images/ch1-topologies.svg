<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".13"/>
    </filter>
    <marker id="ringArrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1f4d">QUATRE TOPOLOGIES À RECONNAÎTRE</text>
  <text x="600" y="80" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">La forme des connexions détermine les chemins possibles et l'impact d'une panne</text>

  <g filter="url(#shadow)">
    <rect x="35" y="125" width="550" height="270" rx="17" fill="#fff" stroke="#f4b942"/>
    <rect x="615" y="125" width="550" height="270" rx="17" fill="#fff" stroke="#c4b5fd"/>
    <rect x="35" y="445" width="550" height="270" rx="17" fill="#fff" stroke="#93c5fd"/>
    <rect x="615" y="445" width="550" height="270" rx="17" fill="#fff" stroke="#86efac"/>
  </g>

  <!-- Bus -->
  <rect x="55" y="106" width="120" height="40" rx="10" fill="#f59e0b"/>
  <text x="115" y="133" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">BUS</text>
  <text x="310" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Tous les hôtes partagent le même support</text>
  <path d="M95 260H525" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <rect x="78" y="247" width="18" height="26" rx="4" fill="#92400e"/>
  <rect x="524" y="247" width="18" height="26" rx="4" fill="#92400e"/>
  <g stroke="#f59e0b" stroke-width="4">
    <path d="M150 260V222"/><path d="M255 260V298"/><path d="M365 260V222"/><path d="M470 260V298"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="800">
    <rect x="108" y="190" width="84" height="38" rx="8" fill="#fff7ed" stroke="#f59e0b"/><text x="150" y="214" fill="#92400e">HÔTE A</text>
    <rect x="213" y="298" width="84" height="38" rx="8" fill="#fff7ed" stroke="#f59e0b"/><text x="255" y="322" fill="#92400e">HÔTE B</text>
    <rect x="323" y="190" width="84" height="38" rx="8" fill="#fff7ed" stroke="#f59e0b"/><text x="365" y="214" fill="#92400e">HÔTE C</text>
    <rect x="428" y="298" width="84" height="38" rx="8" fill="#fff7ed" stroke="#f59e0b"/><text x="470" y="322" fill="#92400e">HÔTE D</text>
  </g>
  <rect x="67" y="352" width="486" height="28" rx="9" fill="#fff7ed"/>
  <text x="310" y="371" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">Une coupure du câble peut interrompre tout le segment.</text>

  <!-- Anneau -->
  <rect x="635" y="106" width="145" height="40" rx="10" fill="#7c3aed"/>
  <text x="707" y="133" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">ANNEAU</text>
  <text x="890" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">Chaque nœud est relié à ses deux voisins</text>
  <path d="M890 202L1025 258L890 327L755 258Z" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linejoin="round" marker-mid="url(#ringArrow)"/>
  <g text-anchor="middle" font-size="14" font-weight="800">
    <rect x="848" y="183" width="84" height="38" rx="8" fill="#f5f3ff" stroke="#7c3aed"/><text x="890" y="207" fill="#5b21b6">NŒUD A</text>
    <rect x="983" y="239" width="84" height="38" rx="8" fill="#f5f3ff" stroke="#7c3aed"/><text x="1025" y="263" fill="#5b21b6">NŒUD B</text>
    <rect x="848" y="308" width="84" height="38" rx="8" fill="#f5f3ff" stroke="#7c3aed"/><text x="890" y="332" fill="#5b21b6">NŒUD C</text>
    <rect x="713" y="239" width="84" height="38" rx="8" fill="#f5f3ff" stroke="#7c3aed"/><text x="755" y="263" fill="#5b21b6">NŒUD D</text>
  </g>
  <circle cx="958" cy="230" r="9" fill="#7c3aed"/>
  <path d="M953 230h10M958 225l5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="647" y="352" width="486" height="28" rx="9" fill="#f5f3ff"/>
  <text x="890" y="371" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Sans chemin de secours, une coupure brise l'anneau.</text>

  <!-- Étoile -->
  <rect x="55" y="426" width="135" height="40" rx="10" fill="#2563eb"/>
  <text x="122" y="453" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">ÉTOILE</text>
  <text x="310" y="492" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Chaque hôte possède son propre lien central</text>
  <g stroke="#2563eb" stroke-width="4">
    <path d="M310 582L150 535"/><path d="M310 582L150 630"/>
    <path d="M310 582L470 535"/><path d="M310 582L470 630"/>
  </g>
  <rect x="250" y="552" width="120" height="60" rx="11" fill="#0755c9"/>
  <text x="310" y="578" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">SWITCH</text>
  <g fill="#93c5fd"><circle cx="281" cy="596" r="5"/><circle cx="300" cy="596" r="5"/><circle cx="319" cy="596" r="5"/><circle cx="338" cy="596" r="5"/></g>
  <g text-anchor="middle" font-size="14" font-weight="800">
    <rect x="108" y="516" width="84" height="38" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="150" y="540" fill="#1e3a8a">HÔTE A</text>
    <rect x="108" y="611" width="84" height="38" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="150" y="635" fill="#1e3a8a">HÔTE B</text>
    <rect x="428" y="516" width="84" height="38" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="470" y="540" fill="#1e3a8a">HÔTE C</text>
    <rect x="428" y="611" width="84" height="38" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="470" y="635" fill="#1e3a8a">HÔTE D</text>
  </g>
  <rect x="67" y="672" width="486" height="28" rx="9" fill="#eff6ff"/>
  <text x="310" y="691" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Un câble défaillant isole un hôte ; le switch reste critique.</text>

  <!-- Maillée -->
  <rect x="635" y="426" width="140" height="40" rx="10" fill="#0f8a5f"/>
  <text x="705" y="453" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">MAILLÉE</text>
  <text x="890" y="492" text-anchor="middle" font-size="16" font-weight="700" fill="#06633f">Plusieurs chemins relient les nœuds</text>
  <g fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round">
    <path d="M720 540H890H1060"/>
    <path d="M770 635H1010"/>
    <path d="M720 540L770 635L890 540L1010 635L1060 540"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="800">
    <rect x="678" y="521" width="84" height="38" rx="8" fill="#ecfdf5" stroke="#10b981"/><text x="720" y="545" fill="#06633f">NŒUD A</text>
    <rect x="848" y="521" width="84" height="38" rx="8" fill="#ecfdf5" stroke="#10b981"/><text x="890" y="545" fill="#06633f">NŒUD B</text>
    <rect x="1018" y="521" width="84" height="38" rx="8" fill="#ecfdf5" stroke="#10b981"/><text x="1060" y="545" fill="#06633f">NŒUD C</text>
    <rect x="728" y="616" width="84" height="38" rx="8" fill="#ecfdf5" stroke="#10b981"/><text x="770" y="640" fill="#06633f">NŒUD D</text>
    <rect x="968" y="616" width="84" height="38" rx="8" fill="#ecfdf5" stroke="#10b981"/><text x="1010" y="640" fill="#06633f">NŒUD E</text>
  </g>
  <rect x="647" y="672" width="486" height="28" rx="9" fill="#ecfdf5"/>
  <text x="890" y="691" text-anchor="middle" font-size="14" font-weight="700" fill="#06633f">La redondance améliore la disponibilité, mais augmente le coût.</text>

  <rect x="35" y="730" width="1130" height="22" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text x="600" y="746" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Dans les LAN modernes, l'étoile domine ; les réseaux étendus utilisent souvent un maillage partiel.</text>
</svg>
