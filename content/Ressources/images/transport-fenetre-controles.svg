<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">TCP — ENVOYER SANS ATTENDRE CHAQUE ACK</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">La fenêtre autorise plusieurs segments en transit simultanément</text>
  <rect x="30" y="120" width="1140" height="235" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <rect x="48" y="102" width="260" height="40" rx="11" fill="#0b5bd3"/><text x="178" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">FENÊTRE GLISSANTE</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="70" y="164" width="160" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150" y="199" font-size="17" font-weight="700" fill="#123c8c">ÉMETTEUR</text>
    <rect x="970" y="164" width="160" height="58" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="1050" y="199" font-size="17" font-weight="700" fill="#06633f">RÉCEPTEUR</text>
  </g>
  <path d="M240 180L960 225M240 205L960 250M240 230L960 275M240 255L960 300" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
  <g font-family="Arial" font-size="13" font-weight="700" fill="#2563eb">
    <text x="510" y="188">SEGMENT 1</text><text x="565" y="221">SEGMENT 2</text><text x="620" y="254">SEGMENT 3</text><text x="675" y="287">SEGMENT 4</text>
  </g>
  <text x="600" y="329" text-anchor="middle" font-family="Arial" font-size="15" fill="#526581">L'émetteur n'attend pas un aller-retour après chaque segment</text>
  <rect x="30" y="415" width="550" height="165" rx="16" fill="#fff" stroke="#6ee7b7" filter="url(#s)"/>
  <rect x="48" y="397" width="250" height="40" rx="11" fill="#0f8a5f"/><text x="173" y="424" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">CONTRÔLE DE FLUX</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="70" y="457" width="130" height="70" rx="10" fill="#d1fae5" stroke="#10b981"/><text x="135" y="486" font-size="16" font-weight="700" fill="#06633f">RÉCEPTEUR</text><text x="135" y="510" font-size="13" fill="#526581">mémoire limitée</text>
    <text x="365" y="474" font-size="18" font-weight="700" fill="#06633f">Fenêtre annoncée</text><text x="365" y="505" font-size="15" fill="#526581">« je peux encore accepter 8 000 octets »</text><text x="365" y="535" font-size="14" font-weight="700" fill="#06633f">Protège la machine destinataire</text>
  </g>
  <rect x="620" y="415" width="550" height="165" rx="16" fill="#fff" stroke="#fdba74" filter="url(#s)"/>
  <rect x="638" y="397" width="290" height="40" rx="11" fill="#f59e0b"/><text x="783" y="424" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">CONTRÔLE DE CONGESTION</text>
  <g font-family="Arial" text-anchor="middle">
    <circle cx="702" cy="492" r="37" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><path d="M676 492H728M702 466V518" stroke="#f59e0b" stroke-width="4"/><text x="895" y="474" font-size="18" font-weight="700" fill="#9a3f00">Fenêtre de congestion</text><text x="895" y="505" font-size="15" fill="#526581">l'envoi augmente ou ralentit selon le réseau</text><text x="895" y="535" font-size="14" font-weight="700" fill="#9a3f00">Protège le réseau traversé</text>
  </g>
  <rect x="250" y="602" width="700" height="36" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="600" y="626" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#5620bb">L'envoi réel respecte la limite la plus contraignante</text>
</svg>
