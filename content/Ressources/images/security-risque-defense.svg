<rect x="70" y="455" width="300" height="65" rx="11" fill="#e0f2fe" stroke="#0284c7"/><text x="220" y="482" font-size="18" font-weight="700" fill="#075985">CONFIDENTIALITÉ</text><text x="220" y="505" font-size="13" fill="#526581">limiter la lecture</text>
