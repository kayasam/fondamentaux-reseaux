<text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">DU RISQUE AUX PROTECTIONS</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Comprendre le scénario avant de choisir un contrôle</text>
<rect x="30" y="120" width="1140" height="235" rx="16" fill="#fff" stroke="#fecaca" filter="url(#s)"/>
<g font-family="Arial" text-anchor="middle"><rect x="70" y="170" width="220" height="110" rx="13" fill="#dbeafe" stroke="#2563eb"/><text x="180" y="207" font-size="18" font-weight="700" fill="#123c8c">ACTIF</text><text x="180" y="240" font-size="14" fill="#526581">base de données</text>
