<rect x="630" y="170" width="220" height="110" rx="13" fill="#fee2e2" stroke="#ef4444"/><text x="740" y="207" font-size="18" font-weight="700" fill="#991b1b">VULNÉRABILITÉ</text><text x="740" y="240" font-size="14" fill="#526581">service non corrigé</text>
<rect x="910" y="170" width="220" height="110" rx="13" fill="#f5f3ff" stroke="#7c3aed"/><text x="1020" y="207" font-size="18" font-weight="700" fill="#5620bb">RISQUE</text><text x="1020" y="240" font-size="14" fill="#526581">vol ou interruption</text></g><path d="M290 225H341M570 225H621M850 225H901" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
