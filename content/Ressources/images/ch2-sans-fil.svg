<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" font-family="Segoe UI,Arial,sans-serif">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1f4d">TRANSMISSIONS SANS FIL</text>
  <text x="600" y="78" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">Plus de mobilité, mais un média partagé et sensible à l'environnement</text>

  <rect x="30" y="110" width="1140" height="205" rx="16" fill="#fff" stroke="#b9d2ff" filter="url(#s)"/>
  <rect x="48" y="93" width="270" height="38" rx="10" fill="#0755c9"/><text x="183" y="119" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">1. PORTÉES INDICATIVES</text>
  <line x1="106" y1="250" x2="1060" y2="250" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="106" cy="250" r="8" fill="#7c3aed"/><circle cx="310" cy="250" r="8" fill="#0891b2"/><circle cx="610" cy="250" r="8" fill="#2563eb"/><circle cx="1060" cy="250" r="8" fill="#0f8a5f"/>

  <!-- NFC : badge et ondes sans contact -->
  <circle cx="106" cy="202" r="34" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="84" y="188" width="35" height="28" rx="5" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="96" cy="202" r="5" fill="#c4b5fd"/>
  <path d="M123 194q9 8 0 16M129 188q16 14 0 28" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/>

  <!-- Bluetooth : rune caractéristique -->
  <circle cx="310" cy="202" r="34" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <path d="M304 179l22 19-22 19v-38l22 19-22 19M291 187l35 30M291 217l35-30" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wi-Fi : point et arcs radio -->
  <circle cx="610" cy="202" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="610" cy="218" r="5" fill="#2563eb"/>
  <path d="M596 207q14-13 28 0M588 198q22-22 44 0M581 188q29-29 58 0" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>

  <!-- 4G / 5G : antenne cellulaire -->
  <circle cx="1060" cy="202" r="34" fill="#dcfce7" stroke="#0f8a5f" stroke-width="2"/>
  <path d="M1060 184v35M1049 220h22M1054 220l6-26 6 26M1046 190q-13 12 0 24M1074 190q13 12 0 24M1039 182q-24 20 0 40M1081 182q24 20 0 40" fill="none" stroke="#0f8a5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g text-anchor="middle">
    <text x="106" y="155" font-size="23" font-weight="800" fill="#6d28d9">NFC</text><text x="106" y="276" font-size="16" font-weight="700" fill="#475569">quelques cm</text><text x="106" y="299" font-size="15" fill="#64748b">badge • paiement</text>
    <text x="310" y="155" font-size="23" font-weight="800" fill="#0e7490">Bluetooth</text><text x="310" y="276" font-size="16" font-weight="700" fill="#475569">quelques mètres</text><text x="310" y="299" font-size="15" fill="#64748b">casque • clavier • IoT</text>
    <text x="610" y="155" font-size="23" font-weight="800" fill="#1d4ed8">Wi-Fi</text><text x="610" y="276" font-size="16" font-weight="700" fill="#475569">dizaines de mètres</text><text x="610" y="299" font-size="15" fill="#64748b">réseau local mobile</text>
    <text x="1060" y="155" font-size="23" font-weight="800" fill="#15803d">4G / 5G</text><text x="1060" y="276" font-size="16" font-weight="700" fill="#475569">jusqu'à plusieurs km</text><text x="1060" y="299" font-size="15" fill="#64748b">réseau de l'opérateur</text>
  </g>

  <rect x="30" y="355" width="1140" height="210" rx="16" fill="#fff" stroke="#8dd3c7" filter="url(#s)"/>
  <rect x="48" y="338" width="230" height="38" rx="10" fill="#0f8a5f"/><text x="163" y="364" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">2. BANDES WI-FI</text>
  <line x1="400" y1="390" x2="400" y2="535" stroke="#e2e8f0"/><line x1="800" y1="390" x2="800" y2="535" stroke="#e2e8f0"/>
  <g text-anchor="middle">
    <circle cx="210" cy="434" r="42" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="210" y="442" font-size="22" font-weight="800" fill="#92400e">2,4</text>
    <text x="210" y="495" font-size="18" font-weight="800" fill="#92400e">Portée +++</text><text x="210" y="520" font-size="15" fill="#64748b">encombrée • peu de canaux</text>
    <circle cx="600" cy="434" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="600" y="442" font-size="22" font-weight="800" fill="#1e3a8a">5</text>
    <text x="600" y="495" font-size="18" font-weight="800" fill="#1d4ed8">Bon compromis</text><text x="600" y="520" font-size="15" fill="#64748b">plus de canaux • portée réduite</text>
    <circle cx="990" cy="434" r="42" fill="#d1fae5" stroke="#10b981" stroke-width="3"/><text x="990" y="442" font-size="22" font-weight="800" fill="#065f46">6</text>
    <text x="990" y="495" font-size="18" font-weight="800" fill="#0f8a5f">Large spectre</text><text x="990" y="520" font-size="15" fill="#64748b">peu encombré • portée plus courte</text>
  </g>

  <rect x="30" y="590" width="1140" height="42" rx="11" fill="#fff7ed" stroke="#fdba74"/>
  <text x="600" y="617" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">Débit annoncé ≠ débit utile : les appareils partagent le temps d'antenne.</text>
</svg>
