<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="590" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">OSI ET TCP/IP — DEUX FAÇONS DE CLASSER</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">TCP/IP regroupe les trois couches OSI les plus proches de l'utilisateur</text>
  <rect x="30" y="120" width="515" height="400" rx="16" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/>
  <rect x="48" y="102" width="210" height="40" rx="11" fill="#7c3aed"/><text x="153" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">MODÈLE OSI</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="80" y="165" width="420" height="85" rx="12" fill="#ede9fe" stroke="#7c3aed"/><circle cx="125" cy="207" r="24" fill="#7c3aed"/><text x="125" y="215" font-size="20" font-weight="700" fill="#fff">7</text><text x="300" y="197" font-size="19" font-weight="700" fill="#5620bb">APPLICATION</text><text x="300" y="225" font-size="14" fill="#526581">services et messages</text>
    <rect x="80" y="270" width="420" height="85" rx="12" fill="#e0f2fe" stroke="#0284c7"/><circle cx="125" cy="312" r="24" fill="#0284c7"/><text x="125" y="320" font-size="20" font-weight="700" fill="#fff">6</text><text x="300" y="302" font-size="19" font-weight="700" fill="#075985">PRÉSENTATION</text><text x="300" y="330" font-size="14" fill="#526581">format, encodage, protection</text>
    <rect x="80" y="375" width="420" height="85" rx="12" fill="#d1fae5" stroke="#10b981"/><circle cx="125" cy="417" r="24" fill="#10b981"/><text x="125" y="425" font-size="20" font-weight="700" fill="#fff">5</text><text x="300" y="407" font-size="19" font-weight="700" fill="#06633f">SESSION</text><text x="300" y="435" font-size="14" fill="#526581">organisation du dialogue</text>
  </g>
  <path d="M555 320H670" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <text x="612" y="302" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#2563eb">REGROUPÉES</text>
  <rect x="690" y="120" width="480" height="400" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <rect x="708" y="102" width="230" height="40" rx="11" fill="#0b5bd3"/><text x="823" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">MODÈLE TCP/IP</text>
  <rect x="745" y="165" width="370" height="295" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="930" y="210" text-anchor="middle" font-family="Arial" font-size="25" font-weight="800" fill="#123c8c">APPLICATION</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="790" y="250" width="115" height="55" rx="9" fill="#ede9fe" stroke="#7c3aed"/><text x="847" y="283" font-size="16" font-weight="700" fill="#5620bb">HTTP</text>
    <rect x="955" y="250" width="115" height="55" rx="9" fill="#ede9fe" stroke="#7c3aed"/><text x="1012" y="283" font-size="16" font-weight="700" fill="#5620bb">DNS</text>
    <rect x="790" y="330" width="115" height="55" rx="9" fill="#d1fae5" stroke="#10b981"/><text x="847" y="363" font-size="16" font-weight="700" fill="#06633f">DHCP</text>
    <rect x="955" y="330" width="115" height="55" rx="9" fill="#e0f2fe" stroke="#0284c7"/><text x="1012" y="363" font-size="16" font-weight="700" fill="#075985">TLS</text>
    <text x="930" y="425" font-size="15" fill="#526581">les frontières réelles ne sont pas toujours nettes</text>
  </g>
  <rect x="235" y="540" width="730" height="36" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="564" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#9a3f00">Les modèles aident à raisonner ; ils ne changent pas les protocoles réellement échangés</text>
