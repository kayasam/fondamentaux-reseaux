<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0f8a5f"/></marker></defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#08285f">SLAAC — SE CONFIGURER GRÂCE AU ROUTEUR</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Le poste fabrique son adresse à partir des informations annoncées sur le lien</text>
  <rect x="30" y="125" width="1140" height="370" rx="16" fill="#fff" stroke="#6ee7b7" filter="url(#s)"/>
  <rect x="48" y="107" width="260" height="40" rx="11" fill="#0f8a5f"/><text x="178" y="134" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">1. QUATRE ÉTAPES</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="70" y="225" width="175" height="100" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="157" y="257" font-size="17" font-weight="800" fill="#123c8c">1. LINK-LOCAL</text><text x="157" y="286" font-size="14" fill="#526581">crée une adresse</text><text x="157" y="309" font-size="14" fill="#526581">fe80::/10</text>
    <rect x="355" y="225" width="175" height="100" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="442" y="257" font-size="17" font-weight="800" fill="#5620bb">2. DÉCOUVERTE</text><text x="442" y="286" font-size="14" fill="#526581">sollicite ou attend</text><text x="442" y="309" font-size="14" fill="#526581">le routeur</text>
    <rect x="640" y="225" width="175" height="100" rx="13" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="727" y="257" font-size="17" font-weight="800" fill="#06633f">3. PRÉFIXE</text><text x="727" y="286" font-size="14" fill="#526581">reçoit par exemple</text><text x="727" y="309" font-size="14" font-weight="700" fill="#06633f">2001:db8:10::/64</text>
    <rect x="925" y="225" width="205" height="100" rx="13" fill="#fff1d6" stroke="#f59e0b" stroke-width="2"/><text x="1027" y="257" font-size="17" font-weight="800" fill="#9a3f00">4. VÉRIFICATION</text><text x="1027" y="286" font-size="14" fill="#526581">forme l'adresse et</text><text x="1027" y="309" font-size="14" fill="#526581">teste son unicité</text>
    <path d="M245 275H347M530 275H632M815 275H917" stroke="#2563eb" stroke-width="5" marker-end="url(#b)"/>
    <rect x="250" y="390" width="700" height="58" rx="11" fill="#ecfdf5" stroke="#6ee7b7"/><text x="600" y="414" font-size="17" font-weight="700" fill="#06633f">Résultat possible : 2001:db8:10::25/64</text><text x="600" y="438" font-size="14" fill="#526581">et une route par défaut apprise grâce au routeur</text>
  </g>
  <rect x="75" y="535" width="500" height="55" rx="11" fill="#eff6ff" stroke="#93c5fd"/><text x="325" y="569" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#123c8c">SLAAC : adresse sans serveur DHCPv6</text>
  <rect x="625" y="535" width="500" height="55" rx="11" fill="#f5f3ff" stroke="#c4b5fd"/><text x="875" y="569" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#5620bb">DHCPv6 peut fournir des informations en complément</text>
</svg>
