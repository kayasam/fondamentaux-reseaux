  <rect x="442" y="241" width="290" height="38" rx="10" fill="#7c3aed"/><text x="587" y="267" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">3. SEGMENTER / PROTÉGER</text>
  <rect x="832" y="241" width="275" height="38" rx="10" fill="#0f8a5f"/><text x="969" y="267" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">4. PARTAGER LA RADIO</text>

  <rect x="145" y="365" width="130" height="72" rx="12" fill="#334155"/><text x="210" y="394" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">SWITCH</text><g fill="#86efac"><circle cx="170" cy="416" r="5"/><circle cx="190" cy="416" r="5"/><circle cx="210" cy="416" r="5"/><circle cx="230" cy="416" r="5"/></g>
