  <circle cx="990" cy="348" r="9" fill="#0f8a5f"/><path d="M965 334q25-24 50 0M950 319q40-39 80 0" fill="none" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/>
  <rect x="842" y="445" width="78" height="42" rx="8" fill="#dcfce7" stroke="#10b981"/><text x="881" y="471" text-anchor="middle" font-weight="700" fill="#065f46">Client A</text>
  <rect x="1060" y="445" width="78" height="42" rx="8" fill="#dcfce7" stroke="#10b981"/><text x="1099" y="471" text-anchor="middle" font-weight="700" fill="#065f46">Client B</text>
  <text x="990" y="507" text-anchor="middle" font-size="15" fill="#64748b">CSMA/CA partage le temps d'antenne</text>

  <rect x="35" y="560" width="1130" height="70" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <circle cx="75" cy="595" r="22" fill="#f59e0b"/><text x="75" y="603" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">!</text>
  <text x="112" y="590" font-size="18" font-weight="800" fill="#9a3412">À retenir</text>
  <text x="112" y="615" font-size="17" fill="#7c2d12">La couche 2 livre une trame dans le réseau local ; la couche 3 permet de changer de réseau.</text>
