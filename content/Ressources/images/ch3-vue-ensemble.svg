  <rect x="465" y="310" width="105" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="517" y="338" text-anchor="middle" font-weight="800" fill="#6d28d9">VLAN 10</text><text x="517" y="359" text-anchor="middle" font-size="13" fill="#64748b">ADMIN</text>
  <rect x="630" y="310" width="105" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="682" y="338" text-anchor="middle" font-weight="800" fill="#92400e">VLAN 20</text><text x="682" y="359" text-anchor="middle" font-size="13" fill="#64748b">TECH</text>
