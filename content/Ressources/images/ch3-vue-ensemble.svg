<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI,Arial,sans-serif">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1f4d">COUCHE 2 — FAIRE CIRCULER LES TRAMES</text>
  <text x="600" y="80" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">Adresser, commuter, segmenter et protéger le réseau local</text>

  <rect x="35" y="115" width="1130" height="100" rx="16" fill="#fff" stroke="#b9d2ff" filter="url(#s)"/>
  <rect x="52" y="98" width="260" height="38" rx="10" fill="#0755c9"/><text x="182" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">1. CRÉER UNE TRAME</text>
  <rect x="90" y="155" width="150" height="36" rx="7" fill="#dbeafe"/><text x="165" y="179" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">MAC destination</text>
  <rect x="240" y="155" width="135" height="36" fill="#bfdbfe"/><text x="307" y="179" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">MAC source</text>
  <rect x="375" y="155" width="115" height="36" fill="#c4b5fd"/><text x="432" y="179" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">EtherType</text>
  <rect x="490" y="155" width="375" height="36" fill="#dcfce7"/><text x="677" y="179" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Données : paquet IP ou ARP</text>
  <rect x="865" y="155" width="100" height="36" rx="7" fill="#fef3c7"/><text x="915" y="173" text-anchor="middle" font-size="15" font-weight="800" fill="#92400e">FCS</text><text x="915" y="187" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92400e">DERNIER CHAMP</text>
  <text x="1080" y="168" text-anchor="middle" font-size="17" font-weight="800" fill="#334155">PDU :</text><text x="1080" y="190" text-anchor="middle" font-size="17" fill="#64748b">trame</text>
  <path d="M90 202H965" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="527" y="211" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">SENS DE TRANSMISSION</text>

