<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">DNS — PLUSIEURS QUESTIONS, PLUSIEURS TYPES</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Le type demandé indique quelle information le client recherche</text>
  <rect x="30" y="120" width="1140" height="450" rx="16" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/>
  <rect x="48" y="102" width="285" height="40" rx="11" fill="#7c3aed"/><text x="190" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">ENREGISTREMENTS</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="70" y="165" width="250" height="105" rx="13" fill="#dbeafe" stroke="#2563eb"/><circle cx="110" cy="202" r="23" fill="#2563eb"/><text x="110" y="210" font-size="17" font-weight="700" fill="#fff">A</text><text x="205" y="198" font-size="17" font-weight="700" fill="#123c8c">NOM → IPv4</text><text x="195" y="232" font-size="14" fill="#526581">web → 192.0.2.20</text>
    <rect x="340" y="165" width="250" height="105" rx="13" fill="#e0f2fe" stroke="#0284c7"/><circle cx="380" cy="202" r="23" fill="#0284c7"/><text x="380" y="210" font-size="14" font-weight="700" fill="#fff">AAAA</text><text x="485" y="198" font-size="17" font-weight="700" fill="#075985">NOM → IPv6</text><text x="465" y="232" font-size="14" fill="#526581">web → 2001:db8::20</text>
    <rect x="610" y="165" width="250" height="105" rx="13" fill="#ede9fe" stroke="#7c3aed"/><circle cx="650" cy="202" r="23" fill="#7c3aed"/><text x="650" y="208" font-size="12" font-weight="700" fill="#fff">CNAME</text><text x="755" y="198" font-size="17" font-weight="700" fill="#5620bb">ALIAS → NOM</text><text x="735" y="232" font-size="14" fill="#526581">www → web.example.</text>
    <rect x="880" y="165" width="250" height="105" rx="13" fill="#d1fae5" stroke="#10b981"/><circle cx="920" cy="202" r="23" fill="#10b981"/><text x="920" y="210" font-size="15" font-weight="700" fill="#fff">MX</text><text x="1025" y="198" font-size="17" font-weight="700" fill="#06633f">SERVEUR MAIL</text><text x="1005" y="232" font-size="14" fill="#526581">→ mail.example.</text>
    <rect x="70" y="305" width="250" height="105" rx="13" fill="#fff7ed" stroke="#f59e0b"/><circle cx="110" cy="342" r="23" fill="#f59e0b"/><text x="110" y="350" font-size="15" font-weight="700" fill="#fff">NS</text><text x="205" y="338" font-size="17" font-weight="700" fill="#9a3f00">SERVEUR DE ZONE</text><text x="195" y="372" font-size="14" fill="#526581">→ ns1.example.</text>
    <rect x="340" y="305" width="250" height="105" rx="13" fill="#fee2e2" stroke="#ef4444"/><circle cx="380" cy="342" r="23" fill="#ef4444"/><text x="380" y="350" font-size="14" font-weight="700" fill="#fff">PTR</text><text x="485" y="338" font-size="17" font-weight="700" fill="#991b1b">IP → NOM</text><text x="465" y="372" font-size="14" fill="#526581">résolution inverse</text>
    <rect x="610" y="305" width="250" height="105" rx="13" fill="#f1f5f9" stroke="#64748b"/><circle cx="650" cy="342" r="23" fill="#64748b"/><text x="650" y="350" font-size="14" font-weight="700" fill="#fff">TXT</text><text x="755" y="338" font-size="17" font-weight="700" fill="#334155">TEXTE / POLITIQUE</text><text x="735" y="372" font-size="14" fill="#526581">validation, SPF…</text>
    <rect x="880" y="305" width="250" height="105" rx="13" fill="#ecfdf5" stroke="#10b981"/><circle cx="920" cy="342" r="23" fill="#10b981"/><text x="920" y="350" font-size="14" font-weight="700" fill="#fff">TTL</text><text x="1025" y="338" font-size="17" font-weight="700" fill="#06633f">DURÉE DE CACHE</text><text x="1005" y="372" font-size="14" fill="#526581">associée aux données</text>
  </g>
  <rect x="190" y="452" width="820" height="80" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="480" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#9a3f00">MX, NS et CNAME désignent normalement des noms</text>
  <text x="600" y="507" text-anchor="middle" font-family="Arial" font-size="15" fill="#526581">Une nouvelle résolution A ou AAAA peut être nécessaire pour obtenir leur adresse</text>
  <rect x="225" y="595" width="750" height="36" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="600" y="619" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#5620bb">DNS est une base de données distribuée — pas seulement un convertisseur nom/IP</text>
</svg>
