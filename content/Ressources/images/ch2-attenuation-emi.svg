<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI,Arial,sans-serif">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1f4d">POURQUOI LE SIGNAL SE DÉGRADE-T-IL ?</text>
  <text x="600" y="78" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">Atténuation, bruit et diaphonie ne désignent pas le même phénomène</text>

  <g filter="url(#s)">
    <rect x="30" y="115" width="360" height="365" rx="16" fill="#fff" stroke="#f4b942" stroke-width="2"/>
    <rect x="420" y="115" width="360" height="365" rx="16" fill="#fff" stroke="#f87171" stroke-width="2"/>
    <rect x="810" y="115" width="360" height="365" rx="16" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <rect x="48" y="98" width="210" height="38" rx="10" fill="#f59e0b"/><text x="153" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">1. ATTÉNUATION</text>
  <rect x="438" y="98" width="155" height="38" rx="10" fill="#dc2626"/><text x="515" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">2. BRUIT</text>
  <rect x="828" y="98" width="200" height="38" rx="10" fill="#7c3aed"/><text x="928" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">3. DIAPHONIE</text>

  <text x="210" y="172" text-anchor="middle" font-size="19" font-weight="700" fill="#92400e">Le signal perd de la puissance</text>
  <path d="M65 264q20-95 40 0t40 0 40 0 40 0" fill="none" stroke="#f59e0b" stroke-width="7"/>
  <path d="M230 264q18-57 36 0t36 0 36 0 28 0" fill="none" stroke="#fbbf24" stroke-width="5"/>
  <path d="M225 215h120" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
  <text x="210" y="330" text-anchor="middle" font-size="16" fill="#475569">Plus la liaison est longue,</text><text x="210" y="353" text-anchor="middle" font-size="16" fill="#475569">plus le signal reçu est faible.</text>
  <rect x="62" y="375" width="296" height="76" rx="10" fill="#fffbeb"/>
  <text x="210" y="402" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Causes</text><text x="210" y="428" text-anchor="middle" font-size="15" fill="#64748b">distance • connecteurs • courbure</text>

  <text x="600" y="172" text-anchor="middle" font-size="19" font-weight="700" fill="#b91c1c">Un signal parasite se superpose</text>
  <path d="M455 242q18-55 36 0t36 0 36 0 36 0 36 0 36 0 36 0" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M455 275l16-20 18 31 17-43 18 48 20-24 18 30 20-51 18 42 20-20 17 27 20-45 19 34 19-16" fill="none" stroke="#dc2626" stroke-width="4"/>
  <text x="600" y="316" text-anchor="middle" font-size="16" fill="#475569">Le récepteur distingue moins bien</text><text x="600" y="339" text-anchor="middle" font-size="16" fill="#475569">les 0 et les 1.</text>
  <rect x="452" y="375" width="296" height="76" rx="10" fill="#fef2f2"/>
  <text x="600" y="402" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">Sources</text><text x="600" y="428" text-anchor="middle" font-size="15" fill="#64748b">moteur • câble électrique • radio</text>

  <text x="990" y="172" text-anchor="middle" font-size="19" font-weight="700" fill="#6d28d9">Une paire perturbe sa voisine</text>
  <path d="M845 226c50-45 90 45 140 0s90 45 150 0M845 248c50 45 90-45 140 0s90-45 150 0" fill="none" stroke="#2563eb" stroke-width="5"/>
  <path d="M845 286c50-45 90 45 140 0s90 45 150 0M845 308c50 45 90-45 140 0s90-45 150 0" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <path d="M955 255v23M1015 255v23" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="990" y="339" text-anchor="middle" font-size="16" fill="#475569">La torsade et le blindage</text><text x="990" y="362" text-anchor="middle" font-size="16" fill="#475569">limitent le couplage entre paires.</text>
  <rect x="842" y="390" width="296" height="61" rx="10" fill="#f5f3ff"/>
  <text x="990" y="417" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">Solutions</text><text x="990" y="441" text-anchor="middle" font-size="15" fill="#64748b">torsade • blindage • terminaison</text>

  <rect x="30" y="520" width="1140" height="125" rx="16" fill="#fff" stroke="#86efac"/>
  <rect x="48" y="503" width="255" height="38" rx="10" fill="#0f8a5f"/><text x="175" y="529" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">4. ACTIONS CORRECTIVES</text>
  <g font-size="16" fill="#334155">
    <circle cx="78" cy="575" r="15" fill="#dcfce7"/><text x="78" y="581" text-anchor="middle" font-weight="800" fill="#15803d">✓</text><text x="108" y="581">Respecter distance et rayon de courbure</text>
    <circle cx="430" cy="575" r="15" fill="#dcfce7"/><text x="430" y="581" text-anchor="middle" font-weight="800" fill="#15803d">✓</text><text x="460" y="581">Éloigner les câbles électriques</text>
    <circle cx="780" cy="575" r="15" fill="#dcfce7"/><text x="780" y="581" text-anchor="middle" font-weight="800" fill="#15803d">✓</text><text x="810" y="581">Nettoyer les connecteurs fibre</text>
    <circle cx="78" cy="616" r="15" fill="#dcfce7"/><text x="78" y="622" text-anchor="middle" font-weight="800" fill="#15803d">✓</text><text x="108" y="622">Tester le câble et les connecteurs</text>
    <circle cx="430" cy="616" r="15" fill="#dcfce7"/><text x="430" y="622" text-anchor="middle" font-weight="800" fill="#15803d">✓</text><text x="460" y="622">Utiliser blindage ou fibre</text>
    <circle cx="780" cy="616" r="15" fill="#dcfce7"/><text x="780" y="622" text-anchor="middle" font-weight="800" fill="#15803d">✓</text><text x="810" y="622">Déplacer l'AP ou changer de canal</text>
  </g>
</svg>
