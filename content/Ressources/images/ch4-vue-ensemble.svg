  <rect x="48" y="102" width="260" height="40" rx="11" fill="#0b5bd3"/><text x="178" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">1. TRAJET D'UN PAQUET</text>
