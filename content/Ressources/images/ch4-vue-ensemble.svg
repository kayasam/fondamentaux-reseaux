  <rect x="260" y="310" width="650" height="47" rx="10" fill="#eff6ff" stroke="#93c5fd"/><text x="585" y="340" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1748b5">IP destination : 203.0.113.20 — identique jusqu'à l'arrivée</text>
  <g font-family="Arial" text-anchor="middle">
