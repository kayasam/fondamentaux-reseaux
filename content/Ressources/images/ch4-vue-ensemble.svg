    <circle cx="390" cy="238" r="56" fill="#d1fae5" stroke="#0f9f6e" stroke-width="3"/><text x="390" y="232" font-size="19" font-weight="700" fill="#06633f">ROUTEUR</text><text x="390" y="258" font-size="14" fill="#06633f">passerelle</text>
