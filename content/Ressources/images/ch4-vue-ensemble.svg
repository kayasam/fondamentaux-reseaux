<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#08285f">COUCHE 3 — TROUVER ET SUIVRE UN CHEMIN</text>
  <text x="600" y="84" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">L'adresse décrit la destination ; les routeurs rapprochent le paquet de cette destination</text>
