<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#10b981"/></marker></defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">HTTPS — HTTP DANS UN CANAL TLS</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">TLS établit des clés, vérifie l'identité puis protège les données applicatives</text>
  <rect x="30" y="120" width="1140" height="310" rx="16" fill="#fff" stroke="#6ee7b7" filter="url(#s)"/>
  <rect x="48" y="102" width="245" height="40" rx="11" fill="#0f8a5f"/><text x="170" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">CANAL SÉCURISÉ</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="70" y="175" width="230" height="150" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="185" cy="220" r="25" fill="#2563eb"/><rect x="135" y="255" width="100" height="48" rx="7" fill="#fff" stroke="#2563eb"/><text x="185" y="358" font-size="19" font-weight="700" fill="#123c8c">NAVIGATEUR</text>
    <rect x="900" y="175" width="230" height="150" rx="15" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><rect x="970" y="205" width="90" height="90" rx="8" fill="#fff" stroke="#10b981"/><text x="1015" y="358" font-size="19" font-weight="700" fill="#06633f">SERVEUR HTTPS</text>
    <rect x="390" y="155" width="420" height="76" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="600" y="185" font-size="18" font-weight="700" fill="#075985">HANDSHAKE TLS</text><text x="600" y="211" font-size="14" fill="#526581">version • paramètres • certificat • clés</text>
    <rect x="390" y="270" width="420" height="76" rx="12" fill="#ecfdf5" stroke="#10b981"/><text x="600" y="300" font-size="18" font-weight="700" fill="#06633f">DONNÉES HTTP PROTÉGÉES</text><text x="600" y="326" font-size="14" fill="#526581">requêtes et réponses chiffrées et authentifiées</text>
  </g>
  <path d="M310 193H380M820 193H890M310 308H380M820 308H890" stroke="#10b981" stroke-width="3" marker-end="url(#a)"/>
  <g font-family="Arial" text-anchor="middle">
    <rect x="30" y="490" width="350" height="110" rx="15" fill="#fff" stroke="#93c5fd" filter="url(#s)"/><rect x="48" y="472" width="160" height="38" rx="10" fill="#0b5bd3"/><text x="128" y="498" font-size="16" font-weight="700" fill="#fff">CONFIDENTIALITÉ</text><text x="205" y="545" font-size="17" font-weight="700" fill="#123c8c">Contenu chiffré</text><text x="205" y="573" font-size="14" fill="#526581">limite l'écoute du trafic</text>
    <rect x="425" y="490" width="350" height="110" rx="15" fill="#fff" stroke="#6ee7b7" filter="url(#s)"/><rect x="443" y="472" width="160" height="38" rx="10" fill="#0f8a5f"/><text x="523" y="498" font-size="16" font-weight="700" fill="#fff">INTÉGRITÉ</text><text x="600" y="545" font-size="17" font-weight="700" fill="#06633f">Altération détectée</text><text x="600" y="573" font-size="14" fill="#526581">messages authentifiés</text>
    <rect x="820" y="490" width="350" height="110" rx="15" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/><rect x="838" y="472" width="180" height="38" rx="10" fill="#7c3aed"/><text x="928" y="498" font-size="16" font-weight="700" fill="#fff">AUTHENTIFICATION</text><text x="995" y="545" font-size="17" font-weight="700" fill="#5620bb">Identité du serveur</text><text x="995" y="573" font-size="14" fill="#526581">certificat vérifié</text>
  </g>
  <rect x="230" y="620" width="740" height="30" rx="9" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="641" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#9a3f00">TLS protège le canal entre ses extrémités — pas les machines après déchiffrement</text>
</svg>
