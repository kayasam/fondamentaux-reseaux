<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#f59e0b"/></marker></defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">DHCP — GÉRER LES ADRESSES DANS LE TEMPS ET ENTRE RÉSEAUX</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Étendue, réservation, bail et relais répondent à quatre besoins différents</text>
  <rect x="30" y="120" width="1140" height="230" rx="16" fill="#fff" stroke="#fdba74" filter="url(#s)"/>
  <rect x="48" y="102" width="250" height="40" rx="11" fill="#f59e0b"/><text x="173" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">PLAGE D'ADRESSES</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="75" y="170" width="250" height="125" rx="13" fill="#dbeafe" stroke="#2563eb"/><text x="200" y="204" font-size="18" font-weight="700" fill="#123c8c">ÉTENDUE</text><text x="200" y="239" font-size="16" fill="#526581">192.168.10.50–150</text><text x="200" y="269" font-size="14" fill="#123c8c">adresses distribuables</text>
    <rect x="345" y="170" width="250" height="125" rx="13" fill="#fee2e2" stroke="#ef4444"/><text x="470" y="204" font-size="18" font-weight="700" fill="#991b1b">EXCLUSION</text><text x="470" y="239" font-size="16" fill="#526581">.50–.59</text><text x="470" y="269" font-size="14" fill="#991b1b">retirées de la distribution</text>
    <rect x="615" y="170" width="250" height="125" rx="13" fill="#ede9fe" stroke="#7c3aed"/><text x="740" y="204" font-size="18" font-weight="700" fill="#5620bb">RÉSERVATION</text><text x="740" y="239" font-size="16" fill="#526581">client → .80</text><text x="740" y="269" font-size="14" fill="#5620bb">configuration prévisible</text>
    <rect x="885" y="170" width="240" height="125" rx="13" fill="#d1fae5" stroke="#10b981"/><text x="1005" y="204" font-size="18" font-weight="700" fill="#06633f">BAIL</text><text x="1005" y="239" font-size="16" fill="#526581">8 heures</text><text x="1005" y="269" font-size="14" fill="#06633f">adresse temporaire</text>
  </g>
  <rect x="30" y="410" width="1140" height="180" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <rect x="48" y="392" width="250" height="40" rx="11" fill="#0b5bd3"/><text x="173" y="419" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">RELAIS DHCP</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="75" y="465" width="220" height="75" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="185" y="495" font-size="18" font-weight="700" fill="#123c8c">CLIENT</text><text x="185" y="522" font-size="14" fill="#526581">VLAN 10 • broadcast</text>
    <rect x="490" y="455" width="220" height="95" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="600" y="490" font-size="18" font-weight="700" fill="#9a3f00">RELAIS / ROUTEUR</text><text x="600" y="519" font-size="14" fill="#526581">transmet vers le serveur</text>
    <rect x="905" y="465" width="220" height="75" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="1015" y="495" font-size="18" font-weight="700" fill="#06633f">SERVEUR DHCP</text><text x="1015" y="522" font-size="14" fill="#526581">réseau serveurs</text>
  </g>
  <path d="M305 502H480M720 502H895" stroke="#f59e0b" stroke-width="4" marker-end="url(#a)"/>
  <rect x="225" y="612" width="750" height="36" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="600" y="636" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#06633f">Le relais permet de centraliser DHCP sans placer un serveur dans chaque VLAN</text>
</svg>
