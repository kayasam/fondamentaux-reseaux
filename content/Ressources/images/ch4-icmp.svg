    <rect x="1030" y="455" width="110" height="65" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="1085" y="495" font-size="18" font-weight="700" fill="#06633f">CIBLE</text>
    <path d="M200 487H303M408 487H553M658 487H803M908 487H1022" stroke="#7c3aed" stroke-width="4" marker-end="url(#b)"/>
    <text x="360" y="555" font-size="15" font-weight="700" fill="#5620bb">TTL 1</text><text x="610" y="555" font-size="15" font-weight="700" fill="#5620bb">TTL 2</text><text x="860" y="555" font-size="15" font-weight="700" fill="#5620bb">TTL 3</text><text x="1085" y="555" font-size="15" font-weight="700" fill="#06633f">TTL 4</text>
