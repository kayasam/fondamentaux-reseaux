  <rect x="48" y="357" width="230" height="40" rx="11" fill="#7c3aed"/><text x="163" y="384" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">2. TRACEROUTE</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="70" y="455" width="130" height="65" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="135" y="495" font-size="18" font-weight="700" fill="#123c8c">PC</text>
