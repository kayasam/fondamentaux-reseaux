    <rect x="90" y="195" width="170" height="70" rx="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="175" y="237" font-size="20" font-weight="700" fill="#123c8c">SOURCE</text>
    <rect x="940" y="195" width="170" height="70" rx="11" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="1025" y="237" font-size="20" font-weight="700" fill="#06633f">DESTINATION</text>
    <path d="M260 212H930" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/><text x="595" y="198" font-size="15" font-weight="700" fill="#0b5bd3">Echo Request</text>
    <path d="M940 252H270" stroke="#0f8a5f" stroke-width="4" marker-end="url(#g)"/><text x="595" y="278" font-size="15" font-weight="700" fill="#0f8a5f">Echo Reply</text>
