    <rect x="70" y="455" width="245" height="65" rx="10" fill="#dbeafe" stroke="#93c5fd"/><text x="192" y="481" font-size="15" font-weight="700" fill="#123c8c">NOM CORRECT ?</text><text x="192" y="504" font-size="13" fill="#526581">cours.example</text>
    <rect x="340" y="455" width="245" height="65" rx="10" fill="#fff7ed" stroke="#f59e0b"/><text x="462" y="481" font-size="15" font-weight="700" fill="#9a3f00">DATE VALIDE ?</text><text x="462" y="504" font-size="13" fill="#526581">horloge du poste</text>
    <rect x="610" y="455" width="245" height="65" rx="10" fill="#ede9fe" stroke="#c4b5fd"/><text x="732" y="481" font-size="15" font-weight="700" fill="#5620bb">SIGNATURE VALIDE ?</text><text x="732" y="504" font-size="13" fill="#526581">chaîne intacte</text>
    <rect x="880" y="455" width="250" height="65" rx="10" fill="#d1fae5" stroke="#6ee7b7"/><text x="1005" y="481" font-size="15" font-weight="700" fill="#06633f">RACINE CONNUE ?</text><text x="1005" y="504" font-size="13" fill="#526581">magasin de confiance</text>
  </g>
  <rect x="190" y="585" width="820" height="42" rx="10" fill="#fee2e2" stroke="#ef4444"/>
  <text x="600" y="612" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#991b1b">Certificat valide ≠ contenu honnête : il vérifie une identité et protège le canal</text>
