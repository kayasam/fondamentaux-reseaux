<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/></marker></defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">CERTIFICAT TLS — RELIER UN NOM À UNE CLÉ</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Le navigateur vérifie une chaîne de signatures et l'identité demandée</text>
  <rect x="30" y="120" width="1140" height="430" rx="16" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/>
  <rect x="48" y="102" width="285" height="40" rx="11" fill="#7c3aed"/><text x="190" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">CHAÎNE DE CONFIANCE</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="70" y="175" width="240" height="170" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="190" cy="222" r="25" fill="#2563eb"/><rect x="140" y="257" width="100" height="48" rx="7" fill="#fff" stroke="#2563eb"/><text x="190" y="378" font-size="19" font-weight="700" fill="#123c8c">NAVIGATEUR</text><text x="190" y="405" font-size="14" fill="#526581">demande cours.example</text>
    <rect x="405" y="160" width="390" height="220" rx="15" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <path d="M470 195H730V325H470Z" fill="#fff" stroke="#7c3aed" stroke-width="2"/><path d="M690 195L730 235H690Z" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="600" y="226" font-size="19" font-weight="700" fill="#5620bb">CERTIFICAT SERVEUR</text><text x="600" y="260" font-size="15" fill="#334155">Nom : cours.example</text><text x="600" y="288" font-size="15" fill="#334155">Clé publique</text><text x="600" y="316" font-size="15" fill="#334155">Validité + signature</text>
    <text x="600" y="412" font-size="19" font-weight="700" fill="#5620bb">IDENTITÉ PRÉSENTÉE</text>
    <rect x="890" y="175" width="240" height="170" rx="15" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><path d="M960 210H1060V285H960Z" fill="#fff" stroke="#10b981"/><circle cx="1010" cy="300" r="17" fill="#10b981"/><text x="1010" y="307" font-size="18" font-weight="700" fill="#fff">✓</text><text x="1010" y="378" font-size="19" font-weight="700" fill="#06633f">AUTORITÉ</text><text x="1010" y="405" font-size="14" fill="#526581">racine reconnue</text>
  </g>
  <path d="M320 260H395M805 260H880" stroke="#7c3aed" stroke-width="3" marker-end="url(#a)"/>
