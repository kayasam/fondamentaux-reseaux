<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="34" font-weight="800" fill="#08285f">COUCHE 4 — RELIER DEUX APPLICATIONS</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">IP atteint la machine ; TCP ou UDP remet les données au bon processus</text>
  <rect x="30" y="120" width="1140" height="290" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <rect x="48" y="102" width="280" height="40" rx="11" fill="#0b5bd3"/>
  <text x="188" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">UNE COMMUNICATION HTTPS</text>
