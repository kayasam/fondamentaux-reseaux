    <rect x="72" y="172" width="215" height="150" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="179" cy="216" r="23" fill="#2563eb"/><rect x="137" y="247" width="84" height="48" rx="7" fill="#fff" stroke="#2563eb"/>
    <text x="179" y="347" font-size="20" font-weight="700" fill="#123c8c">NAVIGATEUR</text><text x="179" y="374" font-size="15" fill="#526581">192.168.1.20:53142</text>
    <rect x="913" y="172" width="215" height="150" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="978" y="194" width="85" height="84" rx="8" fill="#fff" stroke="#7c3aed"/><circle cx="995" cy="211" r="4" fill="#10b981"/><circle cx="1010" cy="211" r="4" fill="#10b981"/>
    <text x="1020" y="347" font-size="20" font-weight="700" fill="#5620bb">SERVEUR WEB</text><text x="1020" y="374" font-size="15" fill="#526581">203.0.113.10:443</text>
  </g>
  <path d="M295 245H905" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/>
  <rect x="420" y="178" width="360" height="62" rx="12" fill="#d1fae5" stroke="#10b981"/>
  <text x="600" y="204" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#06633f">TRANSPORT : TCP</text>
  <text x="600" y="227" text-anchor="middle" font-family="Arial" font-size="14" fill="#06633f">ports, fiabilité, ordre et connexion</text>
  <rect x="420" y="270" width="360" height="62" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="296" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#9a3f00">RÉSEAU : IP</text>
  <text x="600" y="319" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3f00">adressage et acheminement</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="30" y="462" width="350" height="140" rx="15" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
    <rect x="48" y="444" width="130" height="38" rx="10" fill="#0b5bd3"/><text x="113" y="470" font-size="16" font-weight="700" fill="#fff">PORTS</text>
    <text x="205" y="522" font-size="20" font-weight="700" fill="#123c8c">Trouver l'application</text><text x="205" y="555" font-size="15" fill="#526581">client temporaire ↔ service</text>
    <rect x="425" y="462" width="350" height="140" rx="15" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/>
    <rect x="443" y="444" width="130" height="38" rx="10" fill="#7c3aed"/><text x="508" y="470" font-size="16" font-weight="700" fill="#fff">TCP</text>
