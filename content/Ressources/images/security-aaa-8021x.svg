<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><filter id="s"><feDropShadow dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7c3aed"/></marker></defs><rect width="1200" height="650" fill="#f8fafc"/>
<text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">AAA ET 802.1X — CONTRÔLER QUI ENTRE SUR LE RÉSEAU</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">L'identité est vérifiée avant l'application de la politique d'accès</text>
<rect x="30" y="120" width="1140" height="280" rx="16" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/><rect x="48" y="102" width="250" height="40" rx="11" fill="#7c3aed"/><text x="173" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">ÉCHANGE 802.1X</text>
<g font-family="Arial" text-anchor="middle"><rect x="70" y="180" width="230" height="120" rx="14" fill="#dbeafe" stroke="#2563eb"/><text x="185" y="215" font-size="18" font-weight="700" fill="#123c8c">SUPPLICANT</text><text x="185" y="245" font-size="14" fill="#526581">poste ou utilisateur</text><text x="185" y="273" font-size="13" font-weight="700" fill="#123c8c">présente son identité</text>
<rect x="485" y="180" width="230" height="120" rx="14" fill="#fff7ed" stroke="#f59e0b"/><text x="600" y="215" font-size="18" font-weight="700" fill="#9a3f00">AUTHENTICATOR</text><text x="600" y="245" font-size="14" fill="#526581">switch ou point d'accès</text><text x="600" y="273" font-size="13" font-weight="700" fill="#9a3f00">contrôle le port</text>
<rect x="900" y="180" width="230" height="120" rx="14" fill="#d1fae5" stroke="#10b981"/><text x="1015" y="215" font-size="18" font-weight="700" fill="#06633f">RADIUS</text><text x="1015" y="245" font-size="14" fill="#526581">serveur AAA</text><text x="1015" y="273" font-size="13" font-weight="700" fill="#06633f">accepte ou refuse</text></g><path d="M310 240H475M725 240H890" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/>
<rect x="30" y="460" width="350" height="125" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/><rect x="48" y="442" width="210" height="38" rx="10" fill="#0b5bd3"/><text x="153" y="468" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">AUTHENTICATION</text><text x="205" y="520" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#123c8c">Prouver qui l'on est</text><text x="205" y="551" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">mot de passe, certificat, MFA</text>
<rect x="425" y="460" width="350" height="125" rx="16" fill="#fff" stroke="#6ee7b7" filter="url(#s)"/><rect x="443" y="442" width="210" height="38" rx="10" fill="#0f8a5f"/><text x="548" y="468" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">AUTHORIZATION</text><text x="600" y="520" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#06633f">Décider les droits</text><text x="600" y="551" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">VLAN, rôle, ressources</text>
<rect x="820" y="460" width="350" height="125" rx="16" fill="#fff" stroke="#fdba74" filter="url(#s)"/><rect x="838" y="442" width="190" height="38" rx="10" fill="#f59e0b"/><text x="933" y="468" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">ACCOUNTING</text><text x="995" y="520" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#9a3f00">Tracer les accès</text><text x="995" y="551" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">début, fin, résultat</text>
<text x="600" y="625" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#5620bb">Après acceptation, le switch peut ouvrir le port et attribuer une politique</text></svg>
