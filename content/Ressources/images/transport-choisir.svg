<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">CHOISIR LE SERVICE DE TRANSPORT</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Partir des exigences de l'application, puis vérifier le protocole imposé</text>
  <rect x="30" y="120" width="1140" height="490" rx="16" fill="#fff" stroke="#cbd5e1" filter="url(#s)"/>
  <rect x="385" y="145" width="430" height="70" rx="14" fill="#08285f"/>
  <text x="600" y="174" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">LE PROTOCOLE APPLICATIF IMPOSE-T-IL</text>
  <text x="600" y="199" text-anchor="middle" font-family="Arial" font-size="16" fill="#cbd5e1">TCP, UDP ou QUIC ?</text>
  <path d="M600 215V260" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="410" y="270" width="380" height="65" rx="13" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="296" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#9a3f00">TOUS LES OCTETS DOIVENT-ILS</text>
  <text x="600" y="319" text-anchor="middle" font-family="Arial" font-size="15" fill="#526581">arriver dans l'ordre ?</text>
  <text x="392" y="303" text-anchor="end" font-family="Arial" font-size="15" font-weight="700" fill="#7c3aed">OUI</text>
  <text x="808" y="303" font-family="Arial" font-size="15" font-weight="700" fill="#10b981">NON / GÉRÉ PAR L'APP</text>
  <path d="M410 302H230V400" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M790 302H970V400" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <g font-family="Arial" text-anchor="middle">
    <rect x="75" y="410" width="310" height="140" rx="15" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="230" y="448" font-size="25" font-weight="800" fill="#5620bb">TCP</text>
    <text x="230" y="480" font-size="15" fill="#526581">flux fiable et ordonné</text>
    <text x="230" y="510" font-size="14" font-weight="700" fill="#5620bb">SSH • SMTP • HTTP/1.1–2</text>
    <rect x="445" y="410" width="310" height="140" rx="15" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="600" y="448" font-size="25" font-weight="800" fill="#075985">QUIC SUR UDP</text>
    <text x="600" y="480" font-size="15" fill="#526581">fiabilité ajoutée au-dessus d'UDP</text>
    <text x="600" y="510" font-size="14" font-weight="700" fill="#075985">HTTP/3</text>
    <rect x="815" y="410" width="310" height="140" rx="15" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="970" y="448" font-size="25" font-weight="800" fill="#06633f">UDP</text>
    <text x="970" y="480" font-size="15" fill="#526581">datagrammes indépendants</text>
    <text x="970" y="510" font-size="14" font-weight="700" fill="#06633f">DNS • DHCP • temps réel</text>
  </g>
  <path d="M600 335V400" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <text x="600" y="382" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#075985">PROTOCOLE MODERNE</text>
  <rect x="180" y="570" width="840" height="42" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="597" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#9a3f00">Ne jamais choisir uniquement sur l'idée « TCP lent / UDP rapide »</text>
  <rect x="275" y="633" width="650" height="34" rx="9" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="600" y="656" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#075985">Besoin applicatif → services attendus → protocole compatible</text>
</svg>
