<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fffdf7"/>
  <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#111827">Du DHCP au Web</text>

  <rect x="60" y="130" rx="18" ry="18" width="180" height="120" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="150" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e3a8a">Client</text>
  <text x="150" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">PC / Navigateur</text>

  <rect x="390" y="70" rx="18" ry="18" width="180" height="100" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="480" y="115" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#92400e">DHCP</text>
  <text x="480" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#78350f">donne IP + DNS</text>

  <rect x="390" y="240" rx="18" ry="18" width="180" height="100" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="480" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#5b21b6">DNS</text>
  <text x="480" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#4c1d95">traduit le nom</text>

  <rect x="720" y="130" rx="18" ry="18" width="180" height="120" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="810" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#166534">Serveur Web</text>
  <text x="810" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">HTTP / HTTPS</text>

  <line x1="240" y1="160" x2="390" y2="120" stroke="#d97706" stroke-width="4"/>
  <polygon points="390,120 378,112 380,126" fill="#d97706"/>
  <text x="255" y="132" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#92400e">1. DHCP</text>

  <line x1="240" y1="225" x2="390" y2="285" stroke="#7c3aed" stroke-width="4"/>
  <polygon points="390,285 377,279 382,292" fill="#7c3aed"/>
  <text x="262" y="280" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5b21b6">2. DNS</text>

  <line x1="570" y1="290" x2="720" y2="190" stroke="#16a34a" stroke-width="4"/>
  <polygon points="720,190 706,188 713,200" fill="#16a34a"/>
  <text x="595" y="245" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#166534">3. HTTP/HTTPS</text>
</svg>
