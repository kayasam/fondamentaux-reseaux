<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">LES PORTS AIGUILLENT LES DONNÉES</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Une adresse IP, plusieurs applications : le système d'exploitation fait le tri</text>
  <rect x="30" y="118" width="1140" height="438" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <rect x="52" y="100" width="250" height="40" rx="11" fill="#0b5bd3"/><text x="177" y="127" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">MULTIPLEXAGE</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="78" y="165" width="210" height="72" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="183" y="195" font-size="18" font-weight="700" fill="#123c8c">NAVIGATEUR</text><text x="183" y="220" font-size="14" fill="#526581">TCP vers 443</text>
    <rect x="78" y="283" width="210" height="72" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="183" y="313" font-size="18" font-weight="700" fill="#5620bb">TERMINAL SSH</text><text x="183" y="338" font-size="14" fill="#526581">TCP vers 22</text>
    <rect x="78" y="401" width="210" height="72" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="183" y="431" font-size="18" font-weight="700" fill="#06633f">CLIENT DNS</text><text x="183" y="456" font-size="14" fill="#526581">UDP vers 53</text>
    <rect x="480" y="213" width="240" height="205" rx="18" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <text x="600" y="256" font-size="20" font-weight="700" fill="#fff">SYSTÈME</text><text x="600" y="282" font-size="16" fill="#cbd5e1">203.0.113.10</text>
    <rect x="520" y="310" width="160" height="42" rx="8" fill="#fff"/><text x="600" y="337" font-size="16" font-weight="700" fill="#334155">TABLE DES PORTS</text>
    <text x="600" y="386" font-size="14" fill="#cbd5e1">protocole + port</text>
    <rect x="900" y="155" width="220" height="78" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="1010" y="187" font-size="18" font-weight="700" fill="#123c8c">SERVEUR HTTPS</text><text x="1010" y="214" font-size="15" fill="#123c8c">TCP/443</text>
    <rect x="900" y="281" width="220" height="78" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1010" y="313" font-size="18" font-weight="700" fill="#5620bb">SERVEUR SSH</text><text x="1010" y="340" font-size="15" fill="#5620bb">TCP/22</text>
    <rect x="900" y="407" width="220" height="78" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="1010" y="439" font-size="18" font-weight="700" fill="#06633f">SERVEUR DNS</text><text x="1010" y="466" font-size="15" fill="#06633f">UDP/53</text>
  </g>
  <path d="M288 201L470 270M288 319H470M288 437L470 368" stroke="#2563eb" stroke-width="3" marker-end="url(#a)" fill="none"/>
  <path d="M730 270L892 194M730 319H892M730 368L892 446" stroke="#2563eb" stroke-width="3" marker-end="url(#a)" fill="none"/>
  <rect x="305" y="510" width="590" height="62" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="536" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#9a3f00">TCP/53 et UDP/53 sont deux points d'écoute distincts</text>
  <text x="600" y="559" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3f00">Le numéro seul ne suffit pas : il faut aussi connaître le protocole de transport</text>
</svg>
