<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="690" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">DIAGNOSTIC COUCHE 4 — DU SERVICE AU CLIENT</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Tester dans l'ordre permet de localiser la panne sans deviner</text>
  <rect x="30" y="120" width="1140" height="500" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <rect x="48" y="102" width="250" height="40" rx="11" fill="#0b5bd3"/><text x="173" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">MÉTHODE EN 5 ÉTAPES</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="75" y="168" width="190" height="112" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="110" cy="198" r="19" fill="#7c3aed"/><text x="110" y="205" font-size="17" font-weight="700" fill="#fff">1</text><text x="170" y="206" font-size="17" font-weight="700" fill="#5620bb">SERVICE</text><text x="170" y="240" font-size="14" fill="#526581">démarré ?</text><text x="170" y="261" font-size="13" fill="#526581">journaux corrects ?</text>
    <rect x="290" y="168" width="190" height="112" rx="13" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><circle cx="325" cy="198" r="19" fill="#10b981"/><text x="325" y="205" font-size="17" font-weight="700" fill="#fff">2</text><text x="385" y="206" font-size="17" font-weight="700" fill="#06633f">ÉCOUTE</text><text x="385" y="240" font-size="14" fill="#526581">bon protocole ?</text><text x="385" y="261" font-size="13" fill="#526581">bon port ?</text>
    <rect x="505" y="168" width="190" height="112" rx="13" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><circle cx="540" cy="198" r="19" fill="#0284c7"/><text x="540" y="205" font-size="17" font-weight="700" fill="#fff">3</text><text x="600" y="206" font-size="17" font-weight="700" fill="#075985">ADRESSE</text><text x="600" y="240" font-size="14" fill="#526581">réseau ou</text><text x="600" y="261" font-size="13" fill="#526581">localhost seulement ?</text>
    <rect x="720" y="168" width="190" height="112" rx="13" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><circle cx="755" cy="198" r="19" fill="#f59e0b"/><text x="755" y="205" font-size="17" font-weight="700" fill="#fff">4</text><text x="815" y="206" font-size="17" font-weight="700" fill="#9a3f00">RÉSEAU</text><text x="815" y="240" font-size="14" fill="#526581">route, NAT, ACL</text><text x="815" y="261" font-size="13" fill="#526581">et pare-feu</text>
    <rect x="935" y="168" width="190" height="112" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="970" cy="198" r="19" fill="#2563eb"/><text x="970" y="205" font-size="17" font-weight="700" fill="#fff">5</text><text x="1030" y="206" font-size="17" font-weight="700" fill="#123c8c">CLIENT</text><text x="1030" y="240" font-size="14" fill="#526581">connexion puis</text><text x="1030" y="261" font-size="13" fill="#526581">protocole applicatif</text>
  </g>
  <path d="M265 224H281M480 224H496M695 224H711M910 224H926" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
  <g font-family="Arial">
    <rect x="75" y="335" width="500" height="220" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="105" y="372" font-size="18" font-weight="700" fill="#08285f">OBSERVATIONS CÔTÉ SERVEUR</text>
    <text x="105" y="412" font-size="15" fill="#334155">• Aucun LISTEN</text><text x="300" y="412" font-size="15" font-weight="700" fill="#991b1b">→ service ou configuration</text>
    <text x="105" y="449" font-size="15" fill="#334155">• 127.0.0.1:443</text><text x="300" y="449" font-size="15" font-weight="700" fill="#9a3f00">→ accès local seulement</text>
    <text x="105" y="486" font-size="15" fill="#334155">• 0.0.0.0:443</text><text x="300" y="486" font-size="15" font-weight="700" fill="#06633f">→ écoute sur toutes les IPv4</text>
    <text x="105" y="523" font-size="14" fill="#526581">Outils : ss, Get-NetTCPConnection, journaux</text>
    <rect x="625" y="335" width="500" height="220" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="655" y="372" font-size="18" font-weight="700" fill="#08285f">OBSERVATIONS DEPUIS LE CLIENT</text>
    <text x="655" y="412" font-size="15" fill="#334155">• SYN sans réponse</text><text x="855" y="412" font-size="15" font-weight="700" fill="#9a3f00">→ filtrage ou trajet</text>
    <text x="655" y="449" font-size="15" fill="#334155">• RST reçu</text><text x="855" y="449" font-size="15" font-weight="700" fill="#991b1b">→ port refusé</text>
    <text x="655" y="486" font-size="15" fill="#334155">• Handshake réussi</text><text x="855" y="486" font-size="15" font-weight="700" fill="#06633f">→ examiner l'application</text>
    <text x="655" y="523" font-size="14" fill="#526581">Outils : nc, Test-NetConnection, Wireshark</text>
  </g>
  <rect x="210" y="578" width="780" height="44" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="600" y="606" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#06633f">Un ping réussi valide ICMP vers la machine — pas l'écoute du service TCP ou UDP</text>
  <rect x="325" y="640" width="550" height="34" rx="9" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="600" y="663" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#075985">Service → écoute → adresse → réseau → application cliente</text>
</svg>
