<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="580" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">IDENTIFIER UNE CONNEXION TCP</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Le même serveur peut répondre à des milliers de clients simultanément</text>
  <rect x="30" y="120" width="1140" height="390" rx="16" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/>
  <g font-family="Arial" text-anchor="middle">
    <rect x="70" y="165" width="260" height="86" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="200" y="198" font-size="19" font-weight="700" fill="#123c8c">CLIENT A</text><text x="200" y="226" font-size="16" fill="#123c8c">192.168.1.20:53142</text>
    <rect x="70" y="350" width="260" height="86" rx="13" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="200" y="383" font-size="19" font-weight="700" fill="#06633f">CLIENT B</text><text x="200" y="411" font-size="16" fill="#06633f">192.168.1.21:53142</text>
    <rect x="870" y="245" width="260" height="112" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1000" y="284" font-size="20" font-weight="700" fill="#5620bb">SERVEUR HTTPS</text><text x="1000" y="314" font-size="16" fill="#5620bb">203.0.113.10:443</text><text x="1000" y="339" font-size="14" fill="#526581">une socket d'écoute</text>
  </g>
  <path d="M340 208C520 208 690 270 860 285" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <path d="M340 393C520 393 690 332 860 317" stroke="#10b981" stroke-width="4" fill="none" marker-end="url(#a)"/>
  <rect x="390" y="150" width="390" height="76" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="585" y="179" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#123c8c">CONNEXION A</text>
  <text x="585" y="205" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">192.168.1.20 • 53142 • 203.0.113.10 • 443</text>
  <rect x="390" y="376" width="390" height="76" rx="12" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="585" y="405" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#06633f">CONNEXION B</text>
  <text x="585" y="431" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">192.168.1.21 • 53142 • 203.0.113.10 • 443</text>
  <rect x="260" y="477" width="680" height="70" rx="12" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="505" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#9a3f00">QUADRUPLET = IP source + port source + IP destination + port destination</text>
  <text x="600" y="531" text-anchor="middle" font-family="Arial" font-size="14" fill="#9a3f00">Avec le protocole TCP, ces valeurs distinguent précisément chaque connexion</text>
