<svg viewBox="0 0 660 295" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
<defs>
  <marker id="mb" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
    <polygon points="0 0,8 4,0 8" fill="#3B82F6"/>
  </marker>
  <marker id="ma" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
    <polygon points="0 0,8 4,0 8" fill="#F59E0B"/>
  </marker>
  <marker id="mg" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
    <polygon points="0 0,8 4,0 8" fill="#10B981"/>
  </marker>
</defs>

<rect width="660" height="295" fill="#F8FAFC" rx="10"/>
<text x="330" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1E293B">TCP — Établissement de connexion (3-way handshake)</text>

<!-- Client -->
<rect x="20" y="48" width="130" height="38" rx="6" fill="#3B82F6"/>
<text x="85" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="white">Client</text>

<!-- Serveur -->
<rect x="510" y="48" width="130" height="38" rx="6" fill="#3B82F6"/>
<text x="575" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="white">Serveur</text>

<!-- Lifelines -->
<line x1="85" y1="86" x2="85" y2="252" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="575" y1="86" x2="575" y2="252" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5,4"/>

<!-- SYN → -->
<line x1="150" y1="118" x2="507" y2="118" stroke="#3B82F6" stroke-width="2" marker-end="url(#mb)"/>
<text x="330" y="111" text-anchor="middle" font-size="13" font-weight="700" fill="#3B82F6">SYN</text>
<text x="330" y="134" text-anchor="middle" font-size="11" fill="#64748B">« Je veux me connecter »  (numéro de séquence = 100)</text>

<!-- SYN-ACK ← -->
<line x1="510" y1="178" x2="153" y2="178" stroke="#F59E0B" stroke-width="2" marker-end="url(#ma)"/>
<text x="330" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#F59E0B">SYN-ACK</text>
<text x="330" y="194" text-anchor="middle" font-size="11" fill="#64748B">« OK, je suis prêt »  (ACK=101, seq=300)</text>

<!-- ACK → -->
<line x1="150" y1="234" x2="507" y2="234" stroke="#10B981" stroke-width="2" marker-end="url(#mg)"/>
<text x="330" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#10B981">ACK</text>
<text x="330" y="250" text-anchor="middle" font-size="11" fill="#64748B">« Parfait, on commence »  (ACK=301)</text>

<!-- Connexion établie -->
<rect x="190" y="260" width="280" height="28" rx="5" fill="#D1FAE5"/>
<text x="330" y="279" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">Connexion établie — les données peuvent circuler</text>
</svg>
