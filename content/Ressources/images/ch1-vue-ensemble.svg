<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1f4d">DU CLIC AU SERVICE RÉSEAU</text>
  <text x="600" y="80" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">Des équipements différents coopèrent grâce à des protocoles communs</text>

  <rect x="35" y="120" width="1130" height="300" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#shadow)"/>
  <rect x="52" y="102" width="292" height="40" rx="10" fill="#0755c9"/>
  <text x="198" y="129" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1. SUIVRE LE MESSAGE</text>

  <g text-anchor="middle">
    <rect x="70" y="188" width="185" height="120" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="117" y="211" width="91" height="59" rx="7" fill="#fff" stroke="#2563eb" stroke-width="3"/>
    <rect x="141" y="272" width="43" height="8" rx="4" fill="#2563eb"/>
    <text x="162" y="338" font-size="19" font-weight="800" fill="#1e3a8a">CLIENT</text>
    <text x="162" y="362" font-size="15" fill="#64748b">demande une ressource</text>

    <rect x="335" y="188" width="185" height="120" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="374" y="222" width="107" height="57" rx="10" fill="#7c3aed"/>
    <text x="427" y="247" font-size="15" font-weight="800" fill="#fff">SWITCH</text>
    <g fill="#c4b5fd">
      <circle cx="395" cy="263" r="5"/><circle cx="416" cy="263" r="5"/><circle cx="437" cy="263" r="5"/><circle cx="458" cy="263" r="5"/>
    </g>
    <text x="427" y="338" font-size="19" font-weight="800" fill="#5b21b6">RÉSEAU LOCAL</text>
    <text x="427" y="362" font-size="15" fill="#64748b">livre la trame</text>

    <rect x="600" y="188" width="185" height="120" rx="14" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <circle cx="692" cy="247" r="43" fill="#0f8a5f"/>
    <path d="M660 247h64M692 215c-16 15-16 49 0 64M692 215c16 15 16 49 0 64M656 232h72M656 262h72" fill="none" stroke="#a7f3d0" stroke-width="3"/>
    <text x="692" y="338" font-size="19" font-weight="800" fill="#06633f">ROUTEURS</text>
    <text x="692" y="362" font-size="15" fill="#64748b">choisissent un chemin</text>

    <rect x="865" y="188" width="265" height="120" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <rect x="905" y="211" width="68" height="72" rx="8" fill="#f59e0b"/>
    <g fill="#fef3c7">
      <circle cx="922" cy="228" r="5"/><rect x="935" y="224" width="24" height="8" rx="4"/>
      <circle cx="922" cy="247" r="5"/><rect x="935" y="243" width="24" height="8" rx="4"/>
      <circle cx="922" cy="266" r="5"/><rect x="935" y="262" width="24" height="8" rx="4"/>
    </g>
    <text x="1038" y="240" font-size="19" font-weight="800" fill="#9a3412">SERVEUR</text>
    <text x="1038" y="266" font-size="15" fill="#7c2d12">répond au client</text>
    <text x="997" y="338" font-size="19" font-weight="800" fill="#9a3412">SERVICE DISTANT</text>
    <text x="997" y="362" font-size="15" fill="#64748b">Web, DNS, messagerie…</text>
  </g>

  <path d="M255 247H326M520 247H591M785 247H856" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M856 287H794M591 287H529M326 287H264" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="560" y="397" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">REQUÊTE →</text>
  <text x="660" y="397" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">← RÉPONSE</text>

  <g filter="url(#shadow)" text-anchor="middle">
    <rect x="35" y="470" width="206" height="128" rx="15" fill="#fff" stroke="#f4b942"/>
    <rect x="266" y="470" width="206" height="128" rx="15" fill="#fff" stroke="#93c5fd"/>
    <rect x="497" y="470" width="206" height="128" rx="15" fill="#fff" stroke="#c4b5fd"/>
    <rect x="728" y="470" width="206" height="128" rx="15" fill="#fff" stroke="#86efac"/>
    <rect x="959" y="470" width="206" height="128" rx="15" fill="#fff" stroke="#fdba74"/>

    <circle cx="76" cy="508" r="20" fill="#f59e0b"/><text x="76" y="515" font-size="20" font-weight="800" fill="#fff">1</text>
    <text x="148" y="512" font-size="17" font-weight="800" fill="#92400e">SUPPORT</text>
    <text x="148" y="545" font-size="15" fill="#64748b">Cuivre, fibre</text>
    <text x="148" y="567" font-size="15" fill="#64748b">ou ondes radio</text>

    <circle cx="307" cy="508" r="20" fill="#2563eb"/><text x="307" y="515" font-size="20" font-weight="800" fill="#fff">2</text>
    <text x="389" y="512" font-size="17" font-weight="800" fill="#1e3a8a">LIVRAISON</text>
    <text x="389" y="545" font-size="15" fill="#64748b">MAC et trame</text>
    <text x="389" y="567" font-size="15" fill="#64748b">dans le LAN</text>

    <circle cx="538" cy="508" r="20" fill="#7c3aed"/><text x="538" y="515" font-size="20" font-weight="800" fill="#fff">3</text>
    <text x="620" y="512" font-size="17" font-weight="800" fill="#5b21b6">CHEMIN</text>
    <text x="620" y="545" font-size="15" fill="#64748b">Adresse IP</text>
    <text x="620" y="567" font-size="15" fill="#64748b">et routage</text>

    <circle cx="769" cy="508" r="20" fill="#0f8a5f"/><text x="769" y="515" font-size="20" font-weight="800" fill="#fff">4</text>
    <text x="851" y="512" font-size="17" font-weight="800" fill="#06633f">TRANSPORT</text>
    <text x="851" y="545" font-size="15" fill="#64748b">Ports, TCP</text>
    <text x="851" y="567" font-size="15" fill="#64748b">ou UDP</text>

    <circle cx="1000" cy="508" r="20" fill="#ea580c"/><text x="1000" y="515" font-size="20" font-weight="800" fill="#fff">5</text>
    <text x="1082" y="512" font-size="17" font-weight="800" fill="#9a3412">SERVICE</text>
    <text x="1082" y="545" font-size="15" fill="#64748b">HTTP, DNS</text>
    <text x="1082" y="567" font-size="15" fill="#64748b">ou DHCP</text>
  </g>

  <rect x="35" y="620" width="1130" height="30" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="600" y="641" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Chaque couche répond à une question précise ; ensemble, elles rendent la communication possible.</text>
</svg>
