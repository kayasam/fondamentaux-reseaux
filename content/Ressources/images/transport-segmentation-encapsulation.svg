      <rect x="650" y="403" width="220" height="84" rx="9" fill="#fff7ed" stroke="#f59e0b"/><rect x="650" y="403" width="58" height="84" rx="9" fill="#f59e0b"/><text x="679" y="450" font-size="14" font-weight="700" fill="#fff">IP</text><text x="789" y="440" font-size="15" font-weight="700" fill="#9a3f00">SEGMENT TCP 2</text><text x="789" y="465" font-size="13" fill="#526581">paquet IP</text>
      <rect x="890" y="403" width="230" height="84" rx="9" fill="#fff7ed" stroke="#f59e0b"/><rect x="890" y="403" width="58" height="84" rx="9" fill="#f59e0b"/><text x="919" y="450" font-size="14" font-weight="700" fill="#fff">IP</text><text x="1029" y="440" font-size="15" font-weight="700" fill="#9a3f00">SEGMENT TCP 3</text><text x="1029" y="465" font-size="13" fill="#526581">paquet IP</text>
