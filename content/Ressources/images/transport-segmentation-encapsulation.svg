  <rect x="225" y="525" width="750" height="42" rx="10" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="600" y="552" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#075985">À la couche liaison, chaque paquet IP sera à son tour placé dans une trame</text>
