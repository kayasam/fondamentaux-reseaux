  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Chaque couche ajoute les informations dont elle a besoin</text>
  <rect x="30" y="120" width="1140" height="465" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <g font-family="Arial">
