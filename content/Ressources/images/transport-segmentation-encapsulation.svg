      <rect x="650" y="278" width="220" height="84" rx="9" fill="#ecfdf5" stroke="#10b981"/><rect x="650" y="278" width="55" height="84" rx="9" fill="#10b981"/><text x="677" y="325" font-size="14" font-weight="700" fill="#fff">TCP</text><text x="787" y="315" font-size="15" font-weight="700" fill="#06633f">OCTETS 1401–2800</text><text x="787" y="340" font-size="13" fill="#526581">segment 2</text>
