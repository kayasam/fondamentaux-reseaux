<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">AFFICHER UNE PAGE HTTPS — LA CHAÎNE COMPLÈTE</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Chaque réponse rend possible l'étape suivante</text>
  <rect x="30" y="120" width="1140" height="430" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <rect x="48" y="102" width="245" height="40" rx="11" fill="#0b5bd3"/><text x="170" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">6 QUESTIONS</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="70" y="165" width="300" height="90" rx="13" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><circle cx="110" cy="210" r="24" fill="#f59e0b"/><text x="110" y="218" font-size="19" font-weight="700" fill="#fff">1</text><text x="230" y="200" font-size="17" font-weight="700" fill="#9a3f00">CONFIGURATION IP ?</text><text x="230" y="228" font-size="14" fill="#526581">DHCP ou configuration statique</text>
    <rect x="450" y="165" width="300" height="90" rx="13" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="490" cy="210" r="24" fill="#7c3aed"/><text x="490" y="218" font-size="19" font-weight="700" fill="#fff">2</text><text x="610" y="200" font-size="17" font-weight="700" fill="#5620bb">RÉSOLVEUR DNS ?</text><text x="610" y="228" font-size="14" fill="#526581">adresse du serveur de noms</text>
    <rect x="830" y="165" width="300" height="90" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="870" cy="210" r="24" fill="#7c3aed"/><text x="870" y="218" font-size="19" font-weight="700" fill="#fff">3</text><text x="990" y="200" font-size="17" font-weight="700" fill="#5620bb">ADRESSE DU SITE ?</text><text x="990" y="228" font-size="14" fill="#526581">réponse A ou AAAA</text>
    <rect x="70" y="350" width="300" height="90" rx="13" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><circle cx="110" cy="395" r="24" fill="#10b981"/><text x="110" y="403" font-size="19" font-weight="700" fill="#fff">4</text><text x="230" y="385" font-size="17" font-weight="700" fill="#06633f">PORT JOIGNABLE ?</text><text x="230" y="413" font-size="14" fill="#526581">TCP ou QUIC vers le serveur</text>
    <rect x="450" y="350" width="300" height="90" rx="13" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><circle cx="490" cy="395" r="24" fill="#0284c7"/><text x="490" y="403" font-size="19" font-weight="700" fill="#fff">5</text><text x="610" y="385" font-size="17" font-weight="700" fill="#075985">TLS ACCEPTÉ ?</text><text x="610" y="413" font-size="14" fill="#526581">nom, certificat et clés</text>
    <rect x="830" y="350" width="300" height="90" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="870" cy="395" r="24" fill="#2563eb"/><text x="870" y="403" font-size="19" font-weight="700" fill="#fff">6</text><text x="990" y="385" font-size="17" font-weight="700" fill="#123c8c">RÉPONSE HTTP ?</text><text x="990" y="413" font-size="14" fill="#526581">statut, en-têtes et contenu</text>
  </g>
  <path d="M370 210H441M750 210H821M980 265V330M830 395H759M450 395H379" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="215" y="480" width="770" height="42" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="600" y="507" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#06633f">Résultat : la ressource peut être interprétée et affichée par le navigateur</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="75" y="575" width="250" height="50" rx="10" fill="#fff7ed" stroke="#f59e0b"/><text x="200" y="606" font-size="15" font-weight="700" fill="#9a3f00">DHCP CONFIGURE</text>
    <rect x="350" y="575" width="250" height="50" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="475" y="606" font-size="15" font-weight="700" fill="#5620bb">DNS LOCALISE</text>
    <rect x="625" y="575" width="250" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7"/><text x="750" y="606" font-size="15" font-weight="700" fill="#075985">TLS PROTÈGE</text>
    <rect x="900" y="575" width="225" height="50" rx="10" fill="#d1fae5" stroke="#10b981"/><text x="1012" y="606" font-size="15" font-weight="700" fill="#06633f">HTTP ÉCHANGE</text>
  </g>
</svg>
