<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="740" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">ENCAPSULATION ET DÉCAPSULATION</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="16" fill="#526581">Données → segment (TCP) / datagramme (UDP) → paquet → trame</text>

  <rect x="30" y="120" width="1140" height="530" rx="16" fill="#fff" stroke="#cbd5e1" filter="url(#s)"/>
  <rect x="108" y="100" width="340" height="38" rx="11" fill="#0b5bd3"/>
  <text x="278" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">CLIENT — ENCAPSULE EN DESCENDANT</text>
  <rect x="752" y="100" width="340" height="38" rx="11" fill="#7c3aed"/>
  <text x="922" y="125" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">SERVEUR — DÉCAPSULE EN REMONTANT</text>

  <line x1="600" y1="150" x2="600" y2="576" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <g font-family="Arial" text-anchor="middle">
    <!-- Row A : protocoles applicatifs (gauche) -->
    <rect x="60" y="150" width="100" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="110" y="174" font-size="16" font-weight="700" fill="#5620bb">HTTP</text>
    <text x="110" y="194" font-size="12" fill="#526581">port 80</text>
    <rect x="172" y="150" width="100" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="222" y="174" font-size="16" font-weight="700" fill="#5620bb">SMTP</text>
    <text x="222" y="194" font-size="12" fill="#526581">port 25</text>
    <rect x="284" y="150" width="100" height="60" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="334" y="174" font-size="16" font-weight="700" fill="#06633f">DNS</text>
    <text x="334" y="194" font-size="12" fill="#526581">port 53</text>
    <rect x="396" y="150" width="100" height="60" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="446" y="174" font-size="16" font-weight="700" fill="#06633f">DHCP</text>
    <text x="446" y="194" font-size="12" fill="#526581">port 67/68</text>

    <!-- Row A : protocoles applicatifs (droite, mêmes services) -->
    <rect x="704" y="150" width="100" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="754" y="174" font-size="16" font-weight="700" fill="#5620bb">HTTP</text>
    <text x="754" y="194" font-size="12" fill="#526581">port 80</text>
    <rect x="816" y="150" width="100" height="60" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="866" y="174" font-size="16" font-weight="700" fill="#5620bb">SMTP</text>
    <text x="866" y="194" font-size="12" fill="#526581">port 25</text>
    <rect x="928" y="150" width="100" height="60" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="978" y="174" font-size="16" font-weight="700" fill="#06633f">DNS</text>
    <text x="978" y="194" font-size="12" fill="#526581">port 53</text>
    <rect x="1040" y="150" width="100" height="60" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="1090" y="174" font-size="16" font-weight="700" fill="#06633f">DHCP</text>
    <text x="1090" y="194" font-size="12" fill="#526581">port 67/68</text>

    <!-- Row B : TCP / UDP -->
    <rect x="60" y="234" width="212" height="60" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="166" y="260" font-size="17" font-weight="700" fill="#5620bb">TCP</text>
    <text x="166" y="280" font-size="12" fill="#526581">unité : segment</text>
    <rect x="284" y="234" width="212" height="60" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="390" y="260" font-size="17" font-weight="700" fill="#06633f">UDP</text>
    <text x="390" y="280" font-size="12" fill="#526581">unité : datagramme</text>

    <rect x="704" y="234" width="212" height="60" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="810" y="260" font-size="17" font-weight="700" fill="#5620bb">TCP</text>
    <text x="810" y="280" font-size="12" fill="#526581">unité : segment</text>
    <rect x="928" y="234" width="212" height="60" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="1034" y="260" font-size="17" font-weight="700" fill="#06633f">UDP</text>
    <text x="1034" y="280" font-size="12" fill="#526581">unité : datagramme</text>

    <!-- Row C : IP -->
    <rect x="60" y="318" width="436" height="60" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="278" y="344" font-size="17" font-weight="700" fill="#9a3f00">IP</text>
    <text x="278" y="364" font-size="12" fill="#526581">unité : paquet</text>
    <rect x="704" y="318" width="436" height="60" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="922" y="344" font-size="17" font-weight="700" fill="#9a3f00">IP</text>
    <text x="922" y="364" font-size="12" fill="#526581">unité : paquet</text>

    <!-- Row D : Liaison -->
    <rect x="60" y="402" width="436" height="60" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="278" y="428" font-size="17" font-weight="700" fill="#334155">LIAISON</text>
    <text x="278" y="448" font-size="12" fill="#526581">unité : trame</text>
    <rect x="704" y="402" width="436" height="60" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="922" y="428" font-size="17" font-weight="700" fill="#334155">LIAISON</text>
    <text x="922" y="448" font-size="12" fill="#526581">unité : trame</text>

    <!-- Row E : postes -->
    <rect x="203" y="486" width="150" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="278" cy="513" r="16" fill="#2563eb"/>
    <rect x="253" y="536" width="50" height="28" rx="5" fill="#fff" stroke="#2563eb"/>
    <text x="278" y="566" font-size="13" font-weight="700" fill="#123c8c">CLIENT</text>

    <rect x="847" y="486" width="150" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="897" y="500" width="50" height="50" rx="6" fill="#fff" stroke="#7c3aed"/>
    <circle cx="910" cy="513" r="4" fill="#10b981"/><circle cx="925" cy="513" r="4" fill="#10b981"/>
    <text x="922" y="566" font-size="13" font-weight="700" fill="#5620bb">SERVEUR</text>
  </g>

  <!-- Flèches gauche (encapsulation, on descend) -->
  <g stroke="#2563eb" stroke-width="3" fill="none">
    <path d="M110 210V234" marker-end="url(#a)"/>
    <path d="M222 210V234" marker-end="url(#a)"/>
    <path d="M334 210V234" marker-end="url(#a)"/>
    <path d="M446 210V234" marker-end="url(#a)"/>
    <path d="M166 294V318" marker-end="url(#a)"/>
    <path d="M390 294V318" marker-end="url(#a)"/>
    <path d="M278 378V402" marker-end="url(#a)"/>
    <path d="M278 462V486" marker-end="url(#a)"/>
  </g>

  <!-- Flèches droite (décapsulation, on remonte) -->
  <g stroke="#7c3aed" stroke-width="3" fill="none">
    <path d="M754 234V210" marker-end="url(#a)"/>
    <path d="M866 234V210" marker-end="url(#a)"/>
    <path d="M978 234V210" marker-end="url(#a)"/>
    <path d="M1090 234V210" marker-end="url(#a)"/>
    <path d="M810 318V294" marker-end="url(#a)"/>
    <path d="M1034 318V294" marker-end="url(#a)"/>
    <path d="M922 402V378" marker-end="url(#a)"/>
    <path d="M922 486V462" marker-end="url(#a)"/>
  </g>

  <!-- Support physique entre les deux machines -->
  <line x1="278" y1="612" x2="922" y2="612" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="3 7"/>
  <g fill="#fff" stroke="#94a3b8" stroke-width="1.5">
    <rect x="384" y="606" width="12" height="12"/>
    <rect x="524" y="606" width="12" height="12"/>
    <rect x="664" y="606" width="12" height="12"/>
    <rect x="804" y="606" width="12" height="12"/>
  </g>
  <text x="600" y="602" text-anchor="middle" font-family="Arial" font-size="12" fill="#7a869c">support physique (câble, fibre, ondes)</text>

  <rect x="150" y="670" width="900" height="40" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="695" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#9a3f00">Émission : chaque couche ajoute son en-tête en descendant · Réception : chaque couche retire le sien en remontant</text>
</svg>
