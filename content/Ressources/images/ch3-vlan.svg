<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI,Arial,sans-serif">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="route" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0f8a5f"/></marker></defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1f4d">VLAN — PLUSIEURS RÉSEAUX SUR LES MÊMES SWITCHES</text>
  <text x="600" y="80" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">Les ports access accueillent les postes ; le trunk transporte plusieurs VLAN</text>

  <rect x="30" y="115" width="1140" height="350" rx="16" fill="#fff" stroke="#b9d2ff" filter="url(#s)"/>
  <rect x="48" y="98" width="310" height="38" rx="10" fill="#0755c9"/><text x="203" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">1. ACCESS ET TRUNK</text>

