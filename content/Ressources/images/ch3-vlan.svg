  <text x="365" y="304" text-anchor="middle" font-size="12" fill="#cbd5e1">ports Ethernet</text>
  <rect x="745" y="235" width="180" height="78" rx="12" fill="#334155"/><text x="835" y="261" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">SWITCH B</text>
  <g fill="#86efac"><rect x="776" y="275" width="14" height="10" rx="2"/><rect x="796" y="275" width="14" height="10" rx="2"/><rect x="816" y="275" width="14" height="10" rx="2"/><rect x="836" y="275" width="14" height="10" rx="2"/><rect x="856" y="275" width="14" height="10" rx="2"/><rect x="876" y="275" width="14" height="10" rx="2"/></g>
  <text x="835" y="304" text-anchor="middle" font-size="12" fill="#cbd5e1">ports Ethernet</text>
  <path d="M455 274H745" stroke="#7c3aed" stroke-width="11"/>
  <text x="600" y="252" text-anchor="middle" font-size="17" font-weight="800" fill="#6d28d9">TRUNK 802.1Q</text>
