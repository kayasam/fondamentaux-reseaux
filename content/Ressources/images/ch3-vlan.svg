  <text x="835" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">Le switch retire le tag à la sortie access</text>

  <rect x="30" y="510" width="555" height="165" rx="16" fill="#fff" stroke="#fca5a5" filter="url(#s)"/>
  <rect x="48" y="493" width="315" height="38" rx="10" fill="#dc2626"/><text x="205" y="519" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">2. ISOLATION DE COUCHE 2</text>
  <rect x="75" y="565" width="140" height="58" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="145" y="590" text-anchor="middle" font-weight="800" fill="#6d28d9">VLAN 10</text><text x="145" y="611" text-anchor="middle" font-size="13" fill="#64748b">broadcast ADMIN</text>
  <rect x="400" y="565" width="140" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="470" y="590" text-anchor="middle" font-weight="800" fill="#92400e">VLAN 20</text><text x="470" y="611" text-anchor="middle" font-size="13" fill="#64748b">broadcast TECH</text>
  <path d="M215 594H400" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 6"/><circle cx="307" cy="594" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><path d="M298 585l18 18M316 585l-18 18" stroke="#dc2626" stroke-width="3"/>
  <text x="307" y="650" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Aucun échange direct entre VLAN</text>

  <rect x="615" y="510" width="555" height="165" rx="16" fill="#fff" stroke="#86efac" filter="url(#s)"/>
  <rect x="633" y="493" width="315" height="38" rx="10" fill="#0f8a5f"/><text x="790" y="519" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">3. ROUTAGE INTER-VLAN</text>
  <rect x="660" y="565" width="125" height="58" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="722" y="600" text-anchor="middle" font-weight="800" fill="#6d28d9">VLAN 10</text>
  <rect x="820" y="550" width="145" height="88" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/><text x="892" y="583" text-anchor="middle" font-weight="800" fill="#065f46">ROUTEUR /</text><text x="892" y="606" text-anchor="middle" font-weight="800" fill="#065f46">SWITCH L3</text>
  <rect x="1000" y="565" width="125" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="1062" y="600" text-anchor="middle" font-weight="800" fill="#92400e">VLAN 20</text>
  <path d="M785 594H812" stroke="#0f8a5f" stroke-width="4"/>
  <path d="M965 594H992" stroke="#0f8a5f" stroke-width="4" marker-end="url(#route)"/>
  <text x="892" y="661" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Le routage permet de filtrer les échanges.</text>
