    <rect x="1015" y="160" width="120" height="54" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1075" y="184" fill="#6d28d9">ADMIN B</text><text x="1075" y="203" font-size="12" fill="#64748b">VLAN 10</text>
    <rect x="1015" y="260" width="120" height="54" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="1075" y="284" fill="#92400e">TECH B</text><text x="1075" y="303" font-size="12" fill="#64748b">VLAN 20</text>
    <rect x="1015" y="360" width="120" height="54" rx="9" fill="#dcfce7" stroke="#10b981" stroke-width="2"/><text x="1075" y="384" fill="#166534">INVITÉ B</text><text x="1075" y="403" font-size="12" fill="#64748b">VLAN 30</text>
  </g>
  <path d="M185 187L275 250M185 287H275M185 387L275 298M1015 187L925 250M1015 287H925M1015 387L925 298" fill="none" stroke="#94a3b8" stroke-width="4"/>
