    <rect x="65" y="260" width="120" height="54" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="125" y="284" fill="#92400e">TECH A</text><text x="125" y="303" font-size="12" fill="#64748b">VLAN 20</text>
