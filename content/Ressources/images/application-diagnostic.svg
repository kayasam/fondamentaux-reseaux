<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">DIAGNOSTIC APPLICATIF — SUIVRE LES DÉPENDANCES</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">S'arrêter au premier niveau incorrect évite de chercher au hasard</text>
  <rect x="30" y="120" width="1140" height="250" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <rect x="48" y="102" width="260" height="40" rx="11" fill="#0b5bd3"/><text x="178" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">6 CONTRÔLES</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="70" y="170" width="155" height="105" rx="12" fill="#fff7ed" stroke="#f59e0b"/><circle cx="100" cy="198" r="18" fill="#f59e0b"/><text x="100" y="205" font-size="16" font-weight="700" fill="#fff">1</text><text x="147" y="205" font-size="16" font-weight="700" fill="#9a3f00">DHCP</text><text x="147" y="237" font-size="13" fill="#526581">IP, route, DNS</text>
    <rect x="250" y="170" width="155" height="105" rx="12" fill="#ede9fe" stroke="#7c3aed"/><circle cx="280" cy="198" r="18" fill="#7c3aed"/><text x="280" y="205" font-size="16" font-weight="700" fill="#fff">2</text><text x="327" y="205" font-size="16" font-weight="700" fill="#5620bb">DNS</text><text x="327" y="237" font-size="13" fill="#526581">nom → IP</text>
    <rect x="430" y="170" width="155" height="105" rx="12" fill="#d1fae5" stroke="#10b981"/><circle cx="460" cy="198" r="18" fill="#10b981"/><text x="460" y="205" font-size="16" font-weight="700" fill="#fff">3</text><text x="507" y="205" font-size="16" font-weight="700" fill="#06633f">PORT</text><text x="507" y="237" font-size="13" fill="#526581">connexion L4</text>
    <rect x="610" y="170" width="155" height="105" rx="12" fill="#e0f2fe" stroke="#0284c7"/><circle cx="640" cy="198" r="18" fill="#0284c7"/><text x="640" y="205" font-size="16" font-weight="700" fill="#fff">4</text><text x="687" y="205" font-size="16" font-weight="700" fill="#075985">TLS</text><text x="687" y="237" font-size="13" fill="#526581">nom + certificat</text>
    <rect x="790" y="170" width="155" height="105" rx="12" fill="#dbeafe" stroke="#2563eb"/><circle cx="820" cy="198" r="18" fill="#2563eb"/><text x="820" y="205" font-size="16" font-weight="700" fill="#fff">5</text><text x="867" y="205" font-size="16" font-weight="700" fill="#123c8c">HTTP</text><text x="867" y="237" font-size="13" fill="#526581">statut + en-têtes</text>
    <rect x="970" y="170" width="160" height="105" rx="12" fill="#f5f3ff" stroke="#7c3aed"/><circle cx="1000" cy="198" r="18" fill="#7c3aed"/><text x="1000" y="205" font-size="16" font-weight="700" fill="#fff">6</text><text x="1050" y="205" font-size="16" font-weight="700" fill="#5620bb">APP</text><text x="1050" y="237" font-size="13" fill="#526581">contenu / logique</text>
  </g>
  <path d="M225 222H241M405 222H421M585 222H601M765 222H781M945 222H961" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
  <rect x="105" y="300" width="990" height="42" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="600" y="327" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#06633f">Le niveau suivant n'est testable correctement que si ses dépendances fonctionnent</text>
  <rect x="30" y="430" width="550" height="205" rx="16" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/>
  <rect x="48" y="412" width="210" height="40" rx="11" fill="#7c3aed"/><text x="153" y="439" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">SYMPTÔMES</text>
  <g font-family="Arial">
    <text x="80" y="485" font-size="15" fill="#334155">169.254.x.x</text><text x="240" y="485" font-size="15" font-weight="700" fill="#9a3f00">→ commencer par DHCP</text>
    <text x="80" y="525" font-size="15" fill="#334155">IP fonctionne, nom échoue</text><text x="310" y="525" font-size="15" font-weight="700" fill="#5620bb">→ DNS</text>
    <text x="80" y="565" font-size="15" fill="#334155">Erreur de certificat</text><text x="260" y="565" font-size="15" font-weight="700" fill="#075985">→ nom, date, confiance</text>
    <text x="80" y="605" font-size="15" fill="#334155">HTTP 404</text><text x="240" y="605" font-size="15" font-weight="700" fill="#123c8c">→ ressource applicative</text>
  </g>
  <rect x="620" y="430" width="550" height="205" rx="16" fill="#fff" stroke="#6ee7b7" filter="url(#s)"/>
  <rect x="638" y="412" width="210" height="40" rx="11" fill="#0f8a5f"/><text x="743" y="439" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">OUTILS</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="660" y="475" width="210" height="55" rx="10" fill="#fff7ed" stroke="#f59e0b"/><text x="765" y="508" font-size="15" font-weight="700" fill="#9a3f00">ipconfig / ip / route</text>
    <rect x="920" y="475" width="210" height="55" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="1025" y="508" font-size="15" font-weight="700" fill="#5620bb">dig / Resolve-DnsName</text>
    <rect x="660" y="555" width="210" height="55" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="765" y="588" font-size="15" font-weight="700" fill="#123c8c">Test-NetConnection</text>
    <rect x="920" y="555" width="210" height="55" rx="10" fill="#d1fae5" stroke="#10b981"/><text x="1025" y="588" font-size="15" font-weight="700" fill="#06633f">curl / openssl</text>
  </g>
  <rect x="250" y="657" width="700" height="30" rx="9" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="678" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#9a3f00">Un ping réussi ne valide ni DNS, ni TLS, ni le service HTTP</text>
</svg>
