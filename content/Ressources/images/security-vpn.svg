<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><defs><filter id="s"><feDropShadow dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#10b981"/></marker></defs><rect width="1200" height="640" fill="#f8fafc"/>
<text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">VPN — UN TUNNEL PROTÉGÉ SUR UN RÉSEAU NON MAÎTRISÉ</text><text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Le tunnel protège le trajet entre ses extrémités</text>
<rect x="30" y="120" width="1140" height="230" rx="16" fill="#fff" stroke="#6ee7b7" filter="url(#s)"/><rect x="48" y="102" width="220" height="40" rx="11" fill="#0f8a5f"/><text x="158" y="129" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">ACCÈS DISTANT</text>
<g font-family="Arial" text-anchor="middle"><rect x="70" y="180" width="200" height="95" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="170" y="215" font-size="18" font-weight="700" fill="#123c8c">TÉLÉTRAVAILLEUR</text><text x="170" y="245" font-size="14" fill="#526581">client VPN</text><rect x="900" y="180" width="230" height="95" rx="12" fill="#d1fae5" stroke="#10b981"/><text x="1015" y="215" font-size="18" font-weight="700" fill="#06633f">PASSERELLE VPN</text><text x="1015" y="245" font-size="14" fill="#526581">puis politique d'accès</text><rect x="410" y="165" width="380" height="125" rx="60" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/><text x="600" y="207" font-size="20" font-weight="700" fill="#06633f">TUNNEL CHIFFRÉ</text><text x="600" y="238" font-size="14" fill="#526581">authentification • intégrité • confidentialité</text></g><path d="M280 227H400M800 227H890" stroke="#10b981" stroke-width="4" marker-end="url(#a)"/>
<rect x="30" y="420" width="550" height="145" rx="16" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/><rect x="48" y="402" width="190" height="40" rx="11" fill="#7c3aed"/><text x="143" y="429" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">SITE À SITE</text><text x="305" y="475" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#5620bb">Passerelle A ↔ Passerelle B</text><text x="305" y="510" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">deux réseaux reliés sans client sur chaque poste</text>
<rect x="620" y="420" width="550" height="145" rx="16" fill="#fff" stroke="#fdba74" filter="url(#s)"/><rect x="638" y="402" width="220" height="40" rx="11" fill="#f59e0b"/><text x="748" y="429" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#fff">POLITIQUE CLIENT</text><text x="895" y="475" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#9a3f00">Tunnel complet ou split tunnel</text><text x="895" y="510" text-anchor="middle" font-family="Arial" font-size="14" fill="#526581">les routes définissent quel trafic emprunte le VPN</text>
<rect x="205" y="590" width="790" height="36" rx="10" fill="#fee2e2" stroke="#ef4444"/><text x="600" y="614" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#991b1b">VPN établi ≠ accès total : les ACL et autorisations restent nécessaires</text></svg>
