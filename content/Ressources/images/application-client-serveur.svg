<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
  <defs><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter><marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker><marker id="g" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#10b981"/></marker></defs>
  <rect width="1200" height="570" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="33" font-weight="800" fill="#08285f">CLIENT, SERVEUR ET PROTOCOLE</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="17" fill="#526581">Le protocole définit un langage commun entre deux programmes</text>
  <rect x="30" y="120" width="1140" height="370" rx="16" fill="#fff" stroke="#93c5fd" filter="url(#s)"/>
  <g font-family="Arial" text-anchor="middle">
    <rect x="75" y="175" width="250" height="185" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="200" cy="224" r="27" fill="#2563eb"/><rect x="145" y="263" width="110" height="62" rx="8" fill="#fff" stroke="#2563eb"/>
    <text x="200" y="392" font-size="22" font-weight="800" fill="#123c8c">CLIENT</text><text x="200" y="421" font-size="15" fill="#526581">initie une demande</text>
    <rect x="875" y="175" width="250" height="185" rx="16" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <rect x="955" y="205" width="90" height="100" rx="9" fill="#fff" stroke="#10b981"/><circle cx="975" cy="225" r="5" fill="#10b981"/><circle cx="992" cy="225" r="5" fill="#10b981"/>
    <text x="1000" y="392" font-size="22" font-weight="800" fill="#06633f">SERVEUR</text><text x="1000" y="421" font-size="15" fill="#526581">attend et répond</text>
    <rect x="430" y="185" width="340" height="82" rx="13" fill="#ede9fe" stroke="#7c3aed"/><text x="600" y="216" font-size="18" font-weight="700" fill="#5620bb">REQUÊTE</text><text x="600" y="245" font-size="15" fill="#526581">message compris par le protocole</text>
    <rect x="430" y="315" width="340" height="82" rx="13" fill="#ecfdf5" stroke="#10b981"/><text x="600" y="346" font-size="18" font-weight="700" fill="#06633f">RÉPONSE</text><text x="600" y="375" font-size="15" fill="#526581">statut et données éventuelles</text>
  </g>
  <path d="M335 226H420" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><path d="M780 226H865" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
