  <rect x="225" y="510" width="750" height="38" rx="10" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="600" y="535" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#9a3f00">Client et serveur sont des rôles logiciels, pas nécessairement deux types de machines</text>
