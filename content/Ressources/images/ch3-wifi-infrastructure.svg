<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI,Arial,sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".13"/></filter>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="660" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-size="34" font-weight="800" fill="#0b1f4d">WI-FI — LE MODE INFRASTRUCTURE</text>
  <text x="600" y="80" text-anchor="middle" font-size="18" font-weight="600" fill="#64748b">Les clients s'associent à un point d'accès qui fait le pont vers Ethernet</text>

  <rect x="30" y="115" width="1140" height="340" rx="16" fill="#fff" stroke="#8dd3c7" filter="url(#s)"/>
  <rect x="48" y="98" width="305" height="38" rx="10" fill="#0f8a5f"/>
  <text x="200" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">1. PARCOURS D'UNE TRAME</text>

  <!-- Zone radio -->
  <rect x="65" y="155" width="670" height="260" rx="20" fill="#ecfeff" stroke="#67e8f9" stroke-dasharray="8 6"/>
  <text x="90" y="184" font-size="15" font-weight="800" fill="#0e7490">MÉDIA RADIO PARTAGÉ</text>
  <rect x="210" y="146" width="350" height="45" rx="12" fill="#cffafe" stroke="#22d3ee"/>
  <text x="385" y="175" text-anchor="middle" font-size="17" font-weight="800" fill="#0e7490">SSID visible : DAWAN-FORMATION</text>

  <!-- Ordinateur portable -->
  <rect x="100" y="235" width="135" height="82" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <rect x="113" y="248" width="109" height="55" rx="4" fill="#eff6ff"/>
  <path d="M82 325H253L235 344H100Z" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <text x="167" y="375" text-anchor="middle" font-size="16" font-weight="800" fill="#1e3a8a">CLIENT A</text>
  <text x="167" y="397" text-anchor="middle" font-size="13" fill="#64748b">ordinateur portable</text>

  <!-- Téléphone -->
  <rect x="310" y="238" width="72" height="118" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <rect x="319" y="254" width="54" height="81" rx="5" fill="#eff6ff"/>
  <circle cx="346" cy="345" r="5" fill="#2563eb"/>
  <text x="346" y="382" text-anchor="middle" font-size="16" font-weight="800" fill="#1e3a8a">CLIENT B</text>
  <text x="346" y="404" text-anchor="middle" font-size="13" fill="#64748b">smartphone</text>

  <!-- Point d'accès -->
  <circle cx="600" cy="285" r="85" fill="#d1fae5" stroke="#10b981" stroke-width="3"/>
  <circle cx="600" cy="244" r="7" fill="#0f8a5f"/>
  <path d="M580 234q20-20 40 0M568 222q32-32 64 0" fill="none" stroke="#0f8a5f" stroke-width="5" stroke-linecap="round"/>
  <text x="600" y="286" text-anchor="middle" font-size="19" font-weight="800" fill="#065f46">POINT D'ACCÈS</text>
  <text x="600" y="312" text-anchor="middle" font-size="14" fill="#166534">BSSID</text>
  <text x="600" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">02:AA:BB:CC:DD:01</text>

  <!-- Liaisons radio s'arrêtant au bord de l'AP -->
  <path d="M235 277C360 240 435 240 515 270" fill="none" stroke="#0891b2" stroke-width="5" stroke-dasharray="9 7"/>
  <path d="M382 300C430 315 468 316 515 300" fill="none" stroke="#0891b2" stroke-width="5" stroke-dasharray="9 7"/>
  <text x="440" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">trames 802.11</text>

  <!-- Zone Ethernet et switch -->
  <rect x="775" y="155" width="355" height="260" rx="20" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="800" y="184" font-size="15" font-weight="800" fill="#1e3a8a">RÉSEAU ETHERNET</text>
  <path d="M685 285H845" stroke="#2563eb" stroke-width="6" marker-end="url(#b)"/>
  <text x="765" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">pont L2</text>
  <rect x="855" y="235" width="220" height="105" rx="14" fill="#334155"/>
  <text x="965" y="270" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">SWITCH</text>
  <g fill="#86efac"><rect x="895" y="288" width="18" height="12" rx="2"/><rect x="920" y="288" width="18" height="12" rx="2"/><rect x="945" y="288" width="18" height="12" rx="2"/><rect x="970" y="288" width="18" height="12" rx="2"/><rect x="995" y="288" width="18" height="12" rx="2"/><rect x="1020" y="288" width="18" height="12" rx="2"/></g>
  <text x="965" y="325" text-anchor="middle" font-size="13" fill="#cbd5e1">vers le réseau filaire</text>
  <text x="965" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Trames Ethernet 802.3</text>

  <!-- Définitions -->
  <rect x="30" y="500" width="360" height="120" rx="16" fill="#fff" stroke="#67e8f9" filter="url(#s)"/>
  <rect x="48" y="483" width="120" height="38" rx="10" fill="#0891b2"/><text x="108" y="509" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">SSID</text>
  <text x="65" y="552" font-size="17" font-weight="800" fill="#0e7490">Nom du réseau Wi-Fi</text>
  <text x="65" y="580" font-size="15" fill="#475569">Visible et commun aux clients.</text>
  <text x="65" y="603" font-size="15" fill="#475569">Plusieurs AP peuvent annoncer le même SSID.</text>

  <rect x="420" y="500" width="360" height="120" rx="16" fill="#fff" stroke="#86efac" filter="url(#s)"/>
  <rect x="438" y="483" width="130" height="38" rx="10" fill="#0f8a5f"/><text x="503" y="509" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">BSSID</text>
  <text x="455" y="552" font-size="17" font-weight="800" fill="#166534">Identité d'une radio</text>
  <text x="455" y="580" font-size="15" fill="#475569">Généralement une adresse MAC.</text>
  <text x="455" y="603" font-size="15" fill="#475569">Elle distingue les AP d'un même SSID.</text>

  <rect x="810" y="500" width="360" height="120" rx="16" fill="#fff" stroke="#c4b5fd" filter="url(#s)"/>
  <rect x="828" y="483" width="180" height="38" rx="10" fill="#7c3aed"/><text x="918" y="509" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">MODE AD HOC</text>
  <circle cx="885" cy="565" r="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="885" y="571" text-anchor="middle" font-weight="800" fill="#6d28d9">A</text>
  <circle cx="1095" cy="565" r="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1095" y="571" text-anchor="middle" font-weight="800" fill="#6d28d9">B</text>
  <path d="M911 565H1069" stroke="#7c3aed" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="990" y="608" text-anchor="middle" font-size="14" fill="#64748b">Communication directe, sans AP</text>
</svg>
