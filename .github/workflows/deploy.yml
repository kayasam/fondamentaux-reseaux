name: Deploy Quartz site to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Fix folder-page links in the local graph
        run: node scripts/fix-quartz-graph.mjs

      - name: Build Quartz
        run: npx quartz build

      - name: Publish interactive HTML courses
        run: |
          find content -type f -name "*.html" -print0 | while IFS= read -r -d '' file; do
            relative_path="${file#content/}"
            mkdir -p "public/$(dirname "$relative_path")"
            cp "$file" "public/$relative_path"
          done
          find content/Ressources -type f -name "*.html" -print0 | while IFS= read -r -d '' file; do
            relative_path="${file#content/Ressources/}"
            mkdir -p "public/ressources/$(dirname "$relative_path")"
            cp "$file" "public/ressources/$relative_path"
          done
          mkdir -p public/Ressources/html-assets
          cp -R content/Ressources/html-assets/. public/Ressources/html-assets/
          mkdir -p public/ressources
          cp content/Ressources/index-protocoles-et-notions-interactif.html public/ressources/

      - name: Publish individual Markdown downloads
        run: |
          mkdir -p public/telechargements
          for chapter_dir in content/[0-9][0-9]-*; do
            chapter_name="$(basename "$chapter_dir")"
            course_file="$chapter_dir/$chapter_name.md"
            if [ -f "$course_file" ]; then
              cp "$course_file" "public/telechargements/$chapter_name.md"
            fi

            if [ -d "$chapter_dir/tp" ]; then
              find "$chapter_dir/tp" -type f -name "*.md" -print0 | while IFS= read -r -d '' tp_file; do
                relative_path="${tp_file#content/}"
                mkdir -p "public/telechargements/$(dirname "$relative_path")"
                cp "$tp_file" "public/telechargements/$relative_path"
              done
            fi
          done
          cp content/Ressources/index-protocoles-et-notions.md public/telechargements/
          cp content/Ressources/cisco-packet-tracer-commandes.md public/telechargements/

      - name: Create Obsidian archive
        run: |
          mkdir -p download/Fondamentaux-Reseaux/cours
          mkdir -p download/Fondamentaux-Reseaux/Ressources
          cp -R content/[0-9][0-9]-* download/Fondamentaux-Reseaux/cours/
          cp -R content/Ressources/images download/Fondamentaux-Reseaux/Ressources/
          cp -R content/Ressources/html-assets download/Fondamentaux-Reseaux/Ressources/
          cp -R content/Ressources/jeux download/Fondamentaux-Reseaux/Ressources/
          cp -R content/Ressources/schema download/Fondamentaux-Reseaux/Ressources/
          cp content/Ressources/index-protocoles-et-notions* download/Fondamentaux-Reseaux/Ressources/
          cp content/Ressources/cisco-packet-tracer-commandes.md download/Fondamentaux-Reseaux/Ressources/
          cd download
          zip -qr ../public/fondamentaux-reseaux-obsidian.zip Fondamentaux-Reseaux

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
